name: rawrxd

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: rawrxd/gateway:local
    restart: unless-stopped
    ports:
      - "${RAWRXD_HTTP_PORT:-80}:80"
      - "${RAWRXD_HTTPS_PORT:-443}:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "${RAWRXD_TLS_DIR:-./docker/ssl}:/etc/nginx/ssl:ro"
    networks:
      - edge
      - inference
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  ollama-cpu:
    image: ollama/ollama:latest
    profiles: ["ollama-cpu"]
    restart: unless-stopped
    expose:
      - "11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      inference:
        aliases:
          - ollama
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  ollama-gpu:
    image: ollama/ollama:latest
    profiles: ["ollama-gpu"]
    restart: unless-stopped
    expose:
      - "11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      inference:
        aliases:
          - ollama
    security_opt:
      - no-new-privileges:true
    gpus: all
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  ollama-data:

networks:
  edge:
  inference:
    internal: true
