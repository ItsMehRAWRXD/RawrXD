# =============================================================================
# RawrXD Docker Compose - Security Hardened
# Updated: 2026-07-13 for v1.0.1-hotfix3
# Security: Phase 3 - Container hardening and security options
# =============================================================================

version: '3.8'

services:
  rawrxd-backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "23959:23959"
    volumes:
      - models:/opt/rawrxd/models:ro
      - workspace:/workspace
    environment:
      - RAWRXD_HOST=0.0.0.0
      - RAWRXD_PORT=23959
      - RAWRXD_MODEL_PATH=/opt/rawrxd/models
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    networks:
      - rawrxd-net
    restart: unless-stopped
    # Security hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    user: "1000:1000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:23959/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  rawrxd-web:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./web_interface:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
    depends_on:
      - rawrxd-backend
    networks:
      - rawrxd-net
    restart: unless-stopped
    # Security hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
      - /var/cache/nginx:noexec,nosuid,size=100m
      - /var/run:noexec,nosuid,size=100m
    user: "nginx:nginx"

  # Optional: Full IDE via browser (noVNC)
  rawrxd-desktop:
    build:
      context: .
      dockerfile: docker/Dockerfile.full
    ports:
      - "8080:8080"  # noVNC
      - "23960:23959"  # Backend API (mapped to avoid conflict)
    volumes:
      - models:/opt/rawrxd/models:ro
    environment:
      - VNC_PASSWORD=${VNC_PASSWORD:-rawrxd}
    profiles:
      - desktop
    networks:
      - rawrxd-net
    # Security hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=500m

volumes:
  models:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${MODEL_PATH:-./models}
  workspace:

networks:
  rawrxd-net:
    driver: bridge