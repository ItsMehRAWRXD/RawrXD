user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;

    # Docker's embedded DNS permits optional profile services to be absent.
    resolver 127.0.0.11 valid=30s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name _;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 308 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 10m;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        root /usr/share/nginx/html;
        index index.html;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # Readiness means the Windows-native gateway is accepting requests.
        location = /readyz {
            set $native_gateway host.docker.internal:11435;
            rewrite ^ /health break;
            proxy_pass http://$native_gateway;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-API-Key $http_x_api_key;
        }

        # Native Windows x64 gateway. Keep every browser-visible API contract
        # on the same authenticated upstream while /gui remains a static asset.
        location ~ ^/(?:api(?:/|$)|v1(?:/|$)|status$|health$|models$|ask$) {
            set $native_gateway host.docker.internal:11435;
            proxy_pass http://$native_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-API-Key $http_x_api_key;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            add_header X-Accel-Buffering no always;
        }

        # Private container inference. No Ollama port is published by Compose.
        location /ollama/ {
            set $ollama_backend ollama:11434;
            rewrite ^/ollama/(.*)$ /api/$1 break;
            proxy_pass http://$ollama_backend;
            proxy_http_version 1.1;
            proxy_set_header Host ollama;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-API-Key $http_x_api_key;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            add_header X-RawrXD-HexMag-Capability disabled-linux-container always;
            add_header X-Accel-Buffering no always;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
