# Prometheus Configuration for RawrXD Hotpatch System
# Version: 1.0.0
# Last Updated: 2026-07-13

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'rawrxd-production'
    replica: '{{.ExternalURL}}'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - /etc/prometheus/rules/*.yml

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: /metrics
    scrape_interval: 15s

  # RawrXD Hotpatch Metrics
  - job_name: 'rawrxd-hotpatch'
    static_configs:
      - targets: ['localhost:8080']
    metrics_path: /metrics
    scrape_interval: 10s
    scrape_timeout: 5s
    
  # RawrXD Security Metrics
  - job_name: 'rawrxd-security'
    static_configs:
      - targets: ['localhost:8081']
    metrics_path: /metrics
    scrape_interval: 10s
    scrape_timeout: 5s

  # RawrXD System Health
  - job_name: 'rawrxd-health'
    static_configs:
      - targets: ['localhost:8082']
    metrics_path: /health
    scrape_interval: 5s
    scrape_timeout: 3s

  # Windows Exporter (if on Windows)
  - job_name: 'windows-exporter'
    static_configs:
      - targets: ['localhost:9182']
    metrics_path: /metrics
    scrape_interval: 30s

  # Node Exporter (if on Linux)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['localhost:9100']
    metrics_path: /metrics
    scrape_interval: 30s

