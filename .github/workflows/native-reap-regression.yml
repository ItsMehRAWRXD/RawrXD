name: Native REAP regression
on:
  push:
    branches: [native/glm-reap-ownership-fixes-20261122]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scalar-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Exhaustive binary16 roundtrip and rounding boundaries
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -I src tests/reap_half_roundtrip_test.cpp -o reap-half
          ./reap-half
      - name: Compile and execute virtual expert payload integration
        run: |
          g++ -std=c++17 -O2 -pthread -Wall -Wextra -I src tests/reap_virtual_payload_adaptive_test.cpp -o reap-virtual
          ./reap-virtual
      - name: Compile baseline scalar regression
        run: g++ -std=c++17 -O2 -mno-avx -mno-avx2 -pthread -Wall -Wextra -DRAWRXD_REAP_SCALAR_ACCEPTANCE -I src tests/reap_q4k_to_q2k_test.cpp -o reap-scalar
      - name: Execute baseline scalar regression
        run: ./reap-scalar
      - name: Compile runtime-dispatched baseline binary
        run: g++ -std=c++17 -O2 -mno-avx -mno-avx2 -pthread -Wall -Wextra -I src tests/reap_adaptive_dispatch_test.cpp -o reap-adaptive
      - name: Verify scalar versus runtime-dispatched numerical parity
        run: ./reap-adaptive
      - name: Compile and execute baseline streaming conversion
        run: |
          g++ -std=c++17 -O2 -mno-avx -mno-avx2 -pthread -Wall -Wextra -I src tests/reap_quant_range_test.cpp -o reap-range
          ./reap-range
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile native regression
        run: g++ -std=c++17 -O2 -mavx2 -pthread -Wall -Wextra -I src tests/reap_q4k_to_q2k_test.cpp -o reap-regression
      - name: Execute native regression
        run: |
          grep -qw avx2 /proc/cpuinfo
          ./reap-regression
  sanitizer-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile streaming conversion with address and undefined-behavior sanitizers
        run: |
          g++ -std=c++17 -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=all -mno-avx -mno-avx2 -I src tests/reap_quant_range_test.cpp -o reap-range-sanitized
      - name: Execute streaming safety regression
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ./reap-range-sanitized
  sanitizer-virtual-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile virtual payload ownership regression with sanitizers
        run: |
          g++ -std=c++17 -O1 -g -pthread -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=all -mno-avx -mno-avx2 -I src tests/reap_virtual_payload_adaptive_test.cpp -o reap-virtual-sanitized
      - name: Execute cache rollback and virtual payload safety controls
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ./reap-virtual-sanitized
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Exhaustive binary16 roundtrip on MSVC
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /O2 /I src tests\reap_half_roundtrip_test.cpp /Fe:reap-half.exe
          if errorlevel 1 exit /b 1
          reap-half.exe
          if errorlevel 1 exit /b 1
      - name: Compile and execute baseline MSVC scalar regression
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /O2 /DRAWRXD_REAP_SCALAR_ACCEPTANCE=1 /I src tests\reap_q4k_to_q2k_test.cpp /Fe:reap-scalar.exe
          if errorlevel 1 exit /b 1
          reap-scalar.exe
          if errorlevel 1 exit /b 1
      - name: Compile and execute native regression
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /O2 /arch:AVX2 /D__AVX2__ /I src tests\reap_q4k_to_q2k_test.cpp /Fe:reap-regression.exe
          if errorlevel 1 exit /b 1
          reap-regression.exe
          if errorlevel 1 exit /b 1
      - name: Compile baseline and isolated AVX2 dispatch parity
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /O2 /I src /DRAWRXD_REAP_MSVC_ISOLATED_AVX2=1 /c tests\reap_adaptive_dispatch_test.cpp /Fo:reap-baseline.obj
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /O2 /arch:AVX2 /D__AVX2__=1 /I src /c src\deep2\ReapAvx2Msvc.cpp /Fo:reap-avx2.obj
          if errorlevel 1 exit /b 1
          link /nologo reap-baseline.obj reap-avx2.obj /OUT:reap-adaptive.exe
          if errorlevel 1 exit /b 1
          reap-adaptive.exe
          if errorlevel 1 exit /b 1
      - name: Compile and execute baseline virtual expert payload
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /O2 /I src tests\reap_virtual_payload_adaptive_test.cpp /Fe:reap-virtual.exe
          if errorlevel 1 exit /b 1
          reap-virtual.exe
          if errorlevel 1 exit /b 1
      - name: Resolve isolated AVX2 external symbol and validate parity
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /O2 /DRAWRXD_REAP_MSVC_ISOLATED_AVX2=1 /I src /c tests\reap_msvc_link_contract_test.cpp /Fo:reap-link-contract.obj
          if errorlevel 1 exit /b 1
          rem Negative control: omitting the isolated object MUST fail with an unresolved external.
          link /nologo /WX reap-link-contract.obj /OUT:reap-link-missing.exe > reap-link-missing.log 2>&1
          if not errorlevel 1 exit /b 1
          findstr /C:"LNK2019" /C:"LNK2001" reap-link-missing.log
          if errorlevel 1 exit /b 1
          link /nologo /WX reap-link-contract.obj reap-avx2.obj /OUT:reap-link-contract.exe
          if errorlevel 1 exit /b 1
          reap-link-contract.exe
          if errorlevel 1 exit /b 1
      - name: Compile and execute MSVC adaptive virtual expert payload
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /O2 /DRAWRXD_REAP_MSVC_ISOLATED_AVX2=1 /I src /c tests\reap_virtual_payload_adaptive_test.cpp /Fo:reap-virtual-baseline.obj
          if errorlevel 1 exit /b 1
          link /nologo reap-virtual-baseline.obj reap-avx2.obj /OUT:reap-virtual-adaptive.exe
          if errorlevel 1 exit /b 1
          reap-virtual-adaptive.exe
          if errorlevel 1 exit /b 1
      - name: Compile and execute MSVC adaptive streaming conversion
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /O2 /DRAWRXD_REAP_MSVC_ISOLATED_AVX2=1 /I src /c tests\reap_quant_range_test.cpp /Fo:reap-range-baseline.obj
          if errorlevel 1 exit /b 1
          link /nologo reap-range-baseline.obj reap-avx2.obj /OUT:reap-range-adaptive.exe
          if errorlevel 1 exit /b 1
          reap-range-adaptive.exe
          if errorlevel 1 exit /b 1
