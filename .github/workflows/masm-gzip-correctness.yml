name: MASM gzip correctness

on:
  push:
    branches: ["codex/compressed-gguf-model-runtime-20261123"]
    paths:
      - "kernels/deflate_brutal_masm.asm"
      - "src/codec/brutal_gzip_masm_adapter.cpp"
      - "tests/test_brutal_masm_gzip_roundtrip.cpp"
      - "tests/bench_deflate_brutal.cpp"
      - ".github/workflows/masm-gzip-correctness.yml"
  pull_request:
    paths:
      - "kernels/deflate_brutal_masm.asm"
      - "src/codec/brutal_gzip_masm_adapter.cpp"
      - "tests/test_brutal_masm_gzip_roundtrip.cpp"
      - "tests/bench_deflate_brutal.cpp"
      - ".github/workflows/masm-gzip-correctness.yml"
  workflow_dispatch:

jobs:
  msvc-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          submodules: false
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install zlib reference decoder
        shell: pwsh
        run: vcpkg install zlib:x64-windows
      - name: Assemble MASM encoder
        shell: pwsh
        run: |
          ml64 /nologo /c /Fo:build-deflate-brutal.obj kernels/deflate_brutal_masm.asm
          if ($LASTEXITCODE -ne 0) { throw "MASM assembly failed" }
      - name: Compile and run independent gzip roundtrip
        shell: pwsh
        run: |
          $vcpkgRoot = (& vcpkg root).Trim()
          $vcpkg = Join-Path $vcpkgRoot "installed\x64-windows"
          if (-not (Test-Path "$vcpkg\include\zlib.h")) { throw "vcpkg zlib headers missing" }
          cl /nologo /std:c++17 /EHsc /W4 /WX /I include /I "$vcpkg\include" tests/test_brutal_masm_gzip_roundtrip.cpp src/codec/brutal_gzip_masm_adapter.cpp build-deflate-brutal.obj /link /LIBPATH:"$vcpkg\lib" zlib.lib
          if ($LASTEXITCODE -ne 0) { throw "MASM gzip test compile/link failed" }
          .\test_brutal_masm_gzip_roundtrip.exe
          if ($LASTEXITCODE -ne 0) { throw "Independent gzip roundtrip failed" }
      - name: Compile and run the product zlib provider smoke
        shell: pwsh
        run: |
          $vcpkgRoot = (& vcpkg root).Trim()
          $vcpkg = Join-Path $vcpkgRoot "installed\x64-windows"
          cl /nologo /std:c++17 /EHsc /W4 /WX /DRAWRXD_HAVE_ZLIB=1 /I include /I "$vcpkg\include" tests/compression_zlib_provider_compile_test.cpp src/codec/compression_core.cpp /link /LIBPATH:"$vcpkg\lib" zlib.lib
          if ($LASTEXITCODE -ne 0) { throw "Product zlib provider compile/link failed" }
          .\compression_zlib_provider_compile_test.exe
          if ($LASTEXITCODE -ne 0) { throw "Product zlib provider roundtrip failed" }
      - name: Guard checkout cleanup for undeclared legacy evidence gitlink
        if: always()
        shell: bash
        run: |
          # Supply runner-local metadata only for gitlinks missing from .gitmodules.
          # file:///dev/null is never fetched: foreach skips uninitialized entries.
          git ls-files --stage | awk '$1 == "160000" {print $4}' | while IFS= read -r path; do
            mapped_paths="$(git config --file .gitmodules --get-regexp '^submodule\\..*\\.path
 2>/dev/null | sed 's/^[^ ]* //')"
            if ! printf '%s\\n' "$mapped_paths" | grep -Fqx "$path"; then
              key="$(printf '%s' "$path" | sed 's/[^A-Za-z0-9]/-/g')"
              git config --file .gitmodules "submodule.ci-orphaned-$key.path" "$path"
              git config --file .gitmodules "submodule.ci-orphaned-$key.url" "file:///dev/null"
            fi
          done
