name: Native compiler and linker smoke
on:
  push:
    paths:
      - 'tools/native_build/**'
      - '.github/workflows/native-build-smoke.yml'
  pull_request:
    paths:
      - 'tools/native_build/**'
      - '.github/workflows/native-build-smoke.yml'
  workflow_dispatch:
jobs:
  linux-gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile, link, run, and negative gates
        run: python3 tools/native_build/test_native_build.py g++
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Compile, link, run, and negative gates
        shell: cmd
        run: python tools/native_build/test_native_build.py cl
