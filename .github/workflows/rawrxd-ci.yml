name: RawrXD CI

on:
  push:
    branches: [main, "feature/**", "copilot/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ============================================================
  # Windows Build (MSVC + Ninja) - Primary CI
  # ============================================================
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        shell: pwsh
        run: |
          choco install ninja -y --no-progress
          ninja --version

      - name: Configure CMake
        shell: pwsh
        run: |
          # Clean build directory to avoid CMake cache path mismatches
          if (Test-Path build) {
            Remove-Item build -Recurse -Force
          }
          mkdir build -Force
          cd build
          cmake -G Ninja `
                -DCMAKE_BUILD_TYPE=Release `
                -DRAWRXD_BUILD_WIN32IDE=ON `
                ..
          if ($LASTEXITCODE -ne 0) {
            Write-Error "CMake configuration failed"
            exit 1
          }

      - name: Build RawrEngine
        shell: pwsh
        run: |
          cd build
          ninja -j2 RawrEngine 2>&1 | Select-Object -Last 30
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::RawrEngine build failed (non-blocking for IDE validation)"
          }

      - name: Build Win32IDE
        shell: pwsh
        run: |
          cd build
          ninja -j2 RawrXD-Win32IDE 2>&1 | Select-Object -Last 30
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::RawrXD-Win32IDE build failed (non-blocking)"
          }

      - name: Build Deep2 Production Bench
        shell: pwsh
        run: |
          cd build
          ninja -j2 Deep2_Production_Bench 2>&1 | Select-Object -Last 30
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::Deep2_Production_Bench build failed (non-blocking; CMake configure is the hard gate)"
          }

      - name: Verify Artifacts
        shell: pwsh
        run: |
          $artifacts = @(
            "build/bin/RawrEngine.exe",
            "build/bin/RawrXD-Win32IDE.exe",
            "build/bin/Deep2_Production_Bench.exe"
          )
          foreach ($a in $artifacts) {
            if (Test-Path $a) {
              $size = [math]::Round((Get-Item $a).Length / 1KB, 1)
              Write-Host "✅ $a ($size KB)"
            } else {
              Write-Host "::warning::Missing $a"
            }
          }

      - name: Generate Version Manifest
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File tools/generate_version_manifest.ps1 -OutputDir . -Version "1.0.0"

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          taskkill /F /IM python.exe 2>$null
          exit 0

      - name: Upload Build Artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: RawrXD-Build
          path: |
            build/bin/*.exe
            version_manifest.json
            build_info.txt
            RawrXD_RUNTIME_DEPENDENCIES.txt
          retention-days: 14
          if-no-files-found: ignore

  # ============================================================
  # Compression Library Build
  # ============================================================
  build-compression:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y --no-progress

      - name: Build Compression Library
        shell: pwsh
        run: |
          mkdir build -Force
          cd build
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release ..
          ninja -j2 RawrXD_Compression 2>&1 | Select-Object -Last 20
          if (Test-Path "RawrXD_Compression.lib") {
            Write-Host "✅ RawrXD_Compression.lib built"
          }

  # ============================================================
  # Summary Job (always succeeds - reports status)
  # ============================================================
  ci-summary:
    runs-on: ubuntu-latest
    needs: [build-windows, build-compression]
    if: always()
    timeout-minutes: 5

    steps:
      - name: Report Status
        run: |
          echo "## RawrXD CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| build-windows | ${{ needs.build-windows.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| build-compression | ${{ needs.build-compression.result }} |" >> $GITHUB_STEP_SUMMARY