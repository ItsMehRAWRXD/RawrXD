# build-and-release.yml
# Phase F.1 Batch 4/5: Complete CI/CD pipeline with automated releases

name: Build and Release

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'prerelease'
        type: choice
        options:
          - prerelease
          - release
          - nightly

env:
  PRODUCT_NAME: RawrXD Sovereign
  VERSION: ${{ github.ref_name }}

jobs:
  # ============================================================================
  # Build Matrix
  # ============================================================================
  build:
    name: Build (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            platform: windows
            generator: "Visual Studio 17 2022"
            cmake_args: "-A x64"
          - os: ubuntu-22.04
            arch: x64
            platform: linux
            generator: "Ninja"
            cmake_args: ""
          - os: macos-latest
            arch: x64
            platform: macos
            generator: "Ninja"
            cmake_args: ""
          - os: macos-latest
            arch: arm64
            platform: macos
            generator: "Ninja"
            cmake_args: "-DCMAKE_OSX_ARCHITECTURES=arm64"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Windows Build Tools
        if: matrix.platform == 'windows'
        uses: microsoft/setup-msbuild@v2

      - name: Setup Linux Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential
          sudo apt-get install -y libopenblas-dev libomp-dev

      - name: Setup macOS Dependencies
        if: matrix.platform == 'macos'
        run: |
          brew install cmake ninja openblas libomp

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -G "${{ matrix.generator }}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DRWRXD_ENABLE_TESTS=ON \
            -DRWRXD_ENABLE_BENCHMARKS=ON \
            ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run Tests
        run: |
          cd build
          ctest --output-on-failure -C Release

      - name: Package
        run: |
          cmake --build build --config Release --target package

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rawrxd-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            build/dist/*
            !build/dist/*.pdb
          retention-days: 30

  # ============================================================================
  # Benchmark
  # ============================================================================
  benchmark:
    name: Benchmark
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-22.04]
        include:
          - os: windows-latest
            artifact: rawrxd-windows-x64
          - os: ubuntu-22.04
            artifact: rawrxd-linux-x64

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ./dist

      - name: Run Quick Benchmark
        run: |
          cd dist
          chmod +x rawrxd-benchmark || true
          ./rawrxd-benchmark --quick --output benchmark_results.json

      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.os }}
          path: dist/benchmark_results.json

  # ============================================================================
  # Security Scan
  # ============================================================================
  security:
    name: Security Scan
    needs: build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: rawrxd-windows-x64
          path: ./dist

      - name: Run Security Scan
        shell: pwsh
        run: |
          .\packaging\security\verify_release.ps1 `
            -ReleaseDir ".\dist" `
            -VerifySignatures `
            -VerifyChecksums `
            -GenerateReport `
            -ReportPath ".\security_report.json"

      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security_report.json

  # ============================================================================
  # Sign Binaries (Windows)
  # ============================================================================
  sign:
    name: Sign Binaries
    needs: [build, security]
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: rawrxd-windows-x64
          path: ./dist

      - name: Import Certificate
        id: import_cert
        shell: pwsh
        run: |
          $certBytes = [Convert]::FromBase64String("${{ secrets.CODE_SIGNING_CERT }}")
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2
          $cert.Import($certBytes, "${{ secrets.CODE_SIGNING_PASSWORD }}", [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable)
          
          $certPath = "$env:TEMP\signing_cert.pfx"
          $certBytes = $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Pfx)
          [System.IO.File]::WriteAllBytes($certPath, $certBytes)
          
          echo "cert_path=$certPath" >> $env:GITHUB_OUTPUT

      - name: Sign Binaries
        shell: pwsh
        run: |
          .\packaging\security\sign_and_verify.ps1 `
            -BinaryPath ".\dist\rawrxd.exe" `
            -CertificatePath "${{ steps.import_cert.outputs.cert_path }}" `
            -CertificatePassword (ConvertTo-SecureString "${{ secrets.CODE_SIGNING_PASSWORD }}" -AsPlainText -Force) `
            -CreateChecksums `
            -OutputDir ".\signed"

      - name: Upload Signed Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rawrxd-windows-x64-signed
          path: signed/*

  # ============================================================================
  # Create Release
  # ============================================================================
  release:
    name: Create Release
    needs: [build, benchmark, security, sign]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Generate Release Notes
        id: release_notes
        run: |
          cat > RELEASE_NOTES.md << 'EOF'
          ## RawrXD Sovereign ${{ github.ref_name }}

          ### Installation

          **Windows (winget):**
          ```powershell
          winget install RawrXD.SovereignRuntime
          ```

          **Windows (Chocolatey):**
          ```powershell
          choco install rawrxd
          ```

          **macOS (Homebrew):**
          ```bash
          brew install rawrxd
          ```

          **Linux:**
          ```bash
          curl -fsSL https://rawrxd.ai/install.sh | bash
          ```

          ### Verification

          All binaries are signed and include SHA256 checksums. Verify with:

          ```bash
          # Windows
          Get-AuthenticodeSignature rawrxd.exe

          # Linux/macOS
          gpg --verify rawrxd.tar.gz.asc
          sha256sum -c SHA256SUMS
          ```

          ### What's New

          See [CHANGELOG.md](CHANGELOG.md) for full details.
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/**/*
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}

  # ============================================================================
  # Update Package Managers
  # ============================================================================
  update-packages:
    name: Update Package Managers
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, 'alpha') && !contains(github.ref_name, 'beta')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Homebrew Formula
        run: |
          # Update version and SHA256 in formula
          VERSION=${{ github.ref_name }}
          VERSION=${VERSION#v}
          
          # Calculate new SHA256
          curl -sL "https://github.com/${{ github.repository }}/archive/refs/tags/${{ github.ref_name }}.tar.gz" | sha256sum | cut -d' ' -f1 > /tmp/sha256.txt
          
          # Update formula (would push to homebrew-tap repo)
          echo "Would update Homebrew formula to $VERSION"

      - name: Update Winget Manifest
        run: |
          # Update winget manifest
          VERSION=${{ github.ref_name }}
          VERSION=${VERSION#v}
          
          # Update manifest file
          echo "Would update winget manifest to $VERSION"

      - name: Trigger Chocolatey Update
        run: |
          # Trigger chocolatey package update
          echo "Would trigger Chocolatey update"
