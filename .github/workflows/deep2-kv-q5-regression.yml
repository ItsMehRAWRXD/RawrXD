name: Deep2 KV and Q5_0 Native Regression

on:
  push:
    paths:
      - 'src/deep2/K2KVCache.hpp'
      - 'src/deep2/shaders/deep2_qgemv.comp'
      - 'tests/k2_kv_cache_regression.cpp'
      - 'tests/k2_kv_cache_invariants.cpp'
      - 'tests/q5_0_decoder_reference.cpp'
      - '.github/workflows/deep2-kv-q5-regression.yml'
  pull_request:
    paths:
      - 'src/deep2/K2KVCache.hpp'
      - 'src/deep2/shaders/deep2_qgemv.comp'
      - 'tests/k2_kv_cache_regression.cpp'
      - 'tests/k2_kv_cache_invariants.cpp'
      - 'tests/q5_0_decoder_reference.cpp'
      - '.github/workflows/deep2-kv-q5-regression.yml'
  workflow_dispatch:

jobs:
  native-regressions:
    name: ${{ matrix.os }} / ${{ matrix.test }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        test: [k2_kv_cache_regression, k2_kv_cache_invariants, q5_0_decoder_reference]
    steps:
      - uses: actions/checkout@v4
      - name: Configure MSVC toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Compile and execute C++20 regression (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $source = "tests/${{ matrix.test }}.cpp"
          cl /nologo /std:c++20 /EHsc /W4 /I src/deep2 "/Fe:${{ matrix.test }}.exe" $source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "./${{ matrix.test }}.exe"
          exit $LASTEXITCODE
      - name: Compile and execute C++20 regression (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -Wall -Wextra -Werror -Isrc/deep2 "tests/${{ matrix.test }}.cpp" -o "/tmp/${{ matrix.test }}"
          "/tmp/${{ matrix.test }}"
  shader-static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify shader source contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'pc.type == 6u' src/deep2/shaders/deep2_qgemv.comp
          grep -q 'q5_0_weight(rb, j)' src/deep2/shaders/deep2_qgemv.comp
          grep -q 'pc.weightBytes - rowBytes' src/deep2/shaders/deep2_qgemv.comp
