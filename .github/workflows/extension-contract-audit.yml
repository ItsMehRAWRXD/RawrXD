name: Extension contract audit
on:
  push:
    branches:
      - 'audit/extension-failclosed-20261106-gpt6'
    paths:
      - '~dev/rawrxd/src/core/js_extension_host.cpp'
      - '~dev/rawrxd/src/core/js_extension_host_headless_impl.cpp'
      - '~dev/rawrxd/src/core/extension_host_production.cpp'
      - 'tests/test_headless_extension_failclosed.py'
      - 'tests/test_extension_compat_host_contract.py'
      - 'tests/test_extension_entry_containment.py'
      - '.github/workflows/extension-contract-audit.yml'
      - 'tests/native_compiler_linker_gate.py'
      - 'src/build/native_process_runner.hpp'
      - 'src/build/native_process_runner.cpp'
      - 'tests/native_process_runner_win.cpp'
      - 'tests/native_build_pipeline_win.cpp'
  workflow_dispatch:

jobs:
  source-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run extension source contracts
        run: |
          python -m unittest discover -s tests -p test_headless_extension_failclosed.py -v
          python -m unittest discover -s tests -p test_extension_compat_host_contract.py -v
          python -m unittest discover -s tests -p test_extension_entry_containment.py -v

  native-compiler-linker:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile, link, run and reject missing symbols (Linux)
        if: runner.os == 'Linux'
        run: python tests/native_compiler_linker_gate.py
      - name: Compile, link, run and reject missing symbols (MSVC)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq delims=" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%I"
          if not defined VSROOT exit /b 1
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          python tests/native_compiler_linker_gate.py --compiler cl

      - name: Build and run Win32 subprocess integration harness
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq delims=" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%I"
          if not defined VSROOT exit /b 1
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          cl /nologo /EHsc /std:c++17 /utf-8 /Isrc\build src\build\native_process_runner.cpp tests\native_process_runner_win.cpp /Fe:native_process_runner_test.exe
          if errorlevel 1 exit /b 1
          native_process_runner_test.exe

      - name: Build and run C/C++ object-link-executable pipeline through native runner
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq delims=" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%I"
          if not defined VSROOT exit /b 1
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          cl /nologo /EHsc /std:c++17 /utf-8 /Isrc\build src\build\native_process_runner.cpp tests\native_build_pipeline_win.cpp /Fe:native_build_pipeline_test.exe
          if errorlevel 1 exit /b 1
          native_build_pipeline_test.exe
