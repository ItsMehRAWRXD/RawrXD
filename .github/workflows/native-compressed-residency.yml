name: Native compressed tensor residency

on:
  push:
    branches:
      - feat/native-universal-compression-expansion-20261123-v2
    paths:
      - '~dev/rawrxd/src/deep2/NativeTensorCompression.hpp'
      - '~dev/rawrxd/src/deep2/TensorResidencyCache.hpp'
      - '~dev/rawrxd/docs/NATIVE_UNIVERSAL_COMPRESSION.md'
      - '~dev/rawrxd/src/deep2/Deep2Engine_GpuForward.cpp'
      - '~dev/rawrxd/src/deep2/Deep2Engine_VulkanRuntime.cpp'
      - '~dev/rawrxd/src/deep2/Deep2Engine.cpp'
      - '~dev/rawrxd/src/deep2/Deep2Engine.h'
      - '~dev/rawrxd/src/deep2/Deep2Engine_GpuMoEMLA.cpp'
      - '~dev/rawrxd/src/deep2/vulkan_compute.h'
      - '~dev/rawrxd/src/deep2/Deep2DualGpuRowSplit.cpp'
      - '~dev/rawrxd/src/deep2/Deep2DualGpuRowSplit.hpp'
      - '~dev/rawrxd/tests/native_tensor_compression_test.cpp'
      - '~dev/rawrxd/tests/native_compressed_inference_e2e_test.cpp'
      - '~dev/rawrxd/tests/native_synthetic_transformer_e2e_test.cpp'
      - '~dev/rawrxd/CMakeLists.txt'
      - 'src/codec/compression.cpp'
      - 'include/codec/compression.h'
      - 'tests/native_zlib_codec_smoke.cpp'
      - '.github/workflows/native-compressed-residency.yml'
  pull_request:
    paths:
      - '~dev/rawrxd/src/deep2/NativeTensorCompression.hpp'
      - '~dev/rawrxd/src/deep2/TensorResidencyCache.hpp'
      - '~dev/rawrxd/docs/NATIVE_UNIVERSAL_COMPRESSION.md'
      - '~dev/rawrxd/src/deep2/Deep2Engine_GpuForward.cpp'
      - '~dev/rawrxd/src/deep2/Deep2Engine_VulkanRuntime.cpp'
      - '~dev/rawrxd/src/deep2/Deep2Engine.cpp'
      - '~dev/rawrxd/src/deep2/Deep2Engine.h'
      - '~dev/rawrxd/src/deep2/Deep2Engine_GpuMoEMLA.cpp'
      - '~dev/rawrxd/src/deep2/vulkan_compute.h'
      - '~dev/rawrxd/src/deep2/Deep2DualGpuRowSplit.cpp'
      - '~dev/rawrxd/src/deep2/Deep2DualGpuRowSplit.hpp'
      - '~dev/rawrxd/tests/native_tensor_compression_test.cpp'
      - '~dev/rawrxd/tests/native_compressed_inference_e2e_test.cpp'
      - '~dev/rawrxd/tests/native_synthetic_transformer_e2e_test.cpp'
      - '~dev/rawrxd/CMakeLists.txt'
      - 'src/codec/compression.cpp'
      - 'include/codec/compression.h'
      - 'tests/native_zlib_codec_smoke.cpp'
      - '.github/workflows/native-compressed-residency.yml'
  workflow_dispatch:

jobs:
  native-msvc-regression:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile native regression with MSVC
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /std:c++17 /EHsc /W4 /I"~dev\rawrxd\src\deep2" "~dev\rawrxd\tests\native_tensor_compression_test.cpp" /Fe:"%RUNNER_TEMP%\rawrxd_native_tensor_compression_test.exe"
          if errorlevel 1 exit /b %errorlevel%
          "%RUNNER_TEMP%\rawrxd_native_tensor_compression_test.exe"
          if errorlevel 1 exit /b %errorlevel%

      - name: Compile and run synthetic compressed inference E2E
        shell: cmd
        run: |
          cl /nologo /std:c++17 /EHsc /W4 /I"~dev\rawrxd\src\deep2" "~dev\rawrxd\tests\native_compressed_inference_e2e_test.cpp" /Fe:"%RUNNER_TEMP%\rawrxd_compressed_inference_e2e.exe"
          if errorlevel 1 exit /b %errorlevel%
          "%RUNNER_TEMP%\rawrxd_compressed_inference_e2e.exe"
          if errorlevel 1 exit /b %errorlevel%

      - name: Compile and run synthetic compressed transformer E2E
        shell: cmd
        run: |
          cl /nologo /std:c++17 /EHsc /W4 /I"~dev\rawrxd\src\deep2" "~dev\rawrxd\tests\native_synthetic_transformer_e2e_test.cpp" /Fe:"%RUNNER_TEMP%\rawrxd_synthetic_transformer_e2e.exe"
          if errorlevel 1 exit /b %errorlevel%
          "%RUNNER_TEMP%\rawrxd_synthetic_transformer_e2e.exe"
          if errorlevel 1 exit /b %errorlevel%

  zlib-qt6-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Qt6 Core and zlib development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev zlib1g-dev pkg-config
      - name: Compile production zlib codec and run smoke tests
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -fPIC -Iinclude \
            $(pkg-config --cflags Qt6Core zlib) \
            src/codec/compression.cpp tests/native_zlib_codec_smoke.cpp \
            $(pkg-config --libs Qt6Core zlib) \
            -o native_zlib_codec_smoke
          ./native_zlib_codec_smoke
