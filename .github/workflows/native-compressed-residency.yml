name: Native compressed tensor residency

on:
  push:
    branches:
      - feat/native-universal-compression-expansion-20261123-v2
    paths:
      - '~dev/rawrxd/src/deep2/NativeTensorCompression.hpp'
      - '~dev/rawrxd/src/deep2/TensorResidencyCache.hpp'
      - '~dev/rawrxd/docs/NATIVE_UNIVERSAL_COMPRESSION.md'
      - '~dev/rawrxd/src/deep2/Deep2Engine_GpuForward.cpp'
      - '~dev/rawrxd/src/deep2/Deep2Engine_VulkanRuntime.cpp'
      - '~dev/rawrxd/src/deep2/Deep2Engine.cpp'
      - '~dev/rawrxd/src/deep2/Deep2Engine.h'
      - '~dev/rawrxd/tests/native_tensor_compression_test.cpp'
      - '~dev/rawrxd/CMakeLists.txt'
      - '.github/workflows/native-compressed-residency.yml'
  pull_request:
    paths:
      - '~dev/rawrxd/src/deep2/NativeTensorCompression.hpp'
      - '~dev/rawrxd/src/deep2/TensorResidencyCache.hpp'
      - '~dev/rawrxd/docs/NATIVE_UNIVERSAL_COMPRESSION.md'
      - '~dev/rawrxd/src/deep2/Deep2Engine_GpuForward.cpp'
      - '~dev/rawrxd/src/deep2/Deep2Engine_VulkanRuntime.cpp'
      - '~dev/rawrxd/src/deep2/Deep2Engine.cpp'
      - '~dev/rawrxd/src/deep2/Deep2Engine.h'
      - '~dev/rawrxd/tests/native_tensor_compression_test.cpp'
      - '~dev/rawrxd/CMakeLists.txt'
      - '.github/workflows/native-compressed-residency.yml'
  workflow_dispatch:

jobs:
  native-msvc-regression:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile native regression with MSVC
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /std:c++17 /EHsc /W4 /I"~dev\rawrxd\src\deep2" "~dev\rawrxd\tests\native_tensor_compression_test.cpp" /Fe:"%RUNNER_TEMP%\rawrxd_native_tensor_compression_test.exe"
          if errorlevel 1 exit /b %errorlevel%
          "%RUNNER_TEMP%\rawrxd_native_tensor_compression_test.exe"
          if errorlevel 1 exit /b %errorlevel%
