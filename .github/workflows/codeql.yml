# ============================================================================
# CodeQL Analysis for RawrXD
# C++ project security scanning
# ============================================================================

name: "CodeQL Advanced"

on:
  push:
    branches: [main, "feature/**", "copilot/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 1 * * 0"  # Weekly on Sunday

jobs:
  analyze:
    name: Analyze C/C++
    runs-on: windows-latest
    timeout-minutes: 45

    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [cpp]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        shell: pwsh
        run: |
          choco install ninja -y --no-progress
          ninja --version

      - name: Initialize CodeQL
        # Default CodeQL setup is enabled on this repository. Advanced
        # init/analyze cannot upload results while default setup is on.
        if: false
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: manual

      - name: Configure CMake
        shell: pwsh
        run: |
          mkdir build-codeql -Force
          cd build-codeql
          cmake -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DRAWRXD_BUILD_WIN32IDE=OFF `
            -DRAWRXD_ENABLE_MASM=OFF `
            ..
          if ($LASTEXITCODE -ne 0) {
            Write-Error "CMake configuration failed"
            exit 1
          }

      - name: Build for CodeQL
        shell: pwsh
        run: |
          cd build-codeql
          ninja -t clean 2>$null
          ninja -j2 RawrXD_Compression 2>&1 | Select-Object -Last 50
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::RawrXD_Compression build failed (non-blocking; default CodeQL covers analysis)"
          }

      - name: Perform CodeQL Analysis
        # GitHub default CodeQL setup is enabled on this repo. Advanced
        # configuration cannot upload SARIF while default setup is on
        # (the scheduled "CodeQL" workflow already covers scanning).
        if: false
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"

      - name: Report CodeQL Advanced status
        shell: pwsh
        run: |
          Write-Host "CodeQL Advanced upload skipped: repository default CodeQL setup is enabled."
          Write-Host "CMake configure succeeded; default CodeQL workflow owns scanning."
