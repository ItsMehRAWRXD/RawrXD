name: Deterministic mock-model HTTP acceptance
on:
  push:
    branches:
      - audit/mock-transport-20261106
  pull_request:
  workflow_dispatch:
jobs:
  mock-transport:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Real loopback HTTP requests against deterministic mock
        run: python -m unittest discover -s tools/acceptance -p test_mock_model_server.py -v
