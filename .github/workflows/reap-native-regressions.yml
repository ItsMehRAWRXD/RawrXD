name: Native REAP compression regressions
on:
  push:
    branches:
      - codex/reap-native-r01-gguf-parser
    paths:
      - 'src/reap/**'
      - 'tools/reap_*regression.cpp'
      - '.github/workflows/reap-native-regressions.yml'
      - 'CMakeLists.txt'
  pull_request:
    paths:
      - 'src/reap/**'
      - 'tools/reap_*regression.cpp'
      - '.github/workflows/reap-native-regressions.yml'
      - 'CMakeLists.txt'
jobs:
  native-reap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile and execute standalone native REAP regression tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rawrxd-reap-regressions
          shopt -s nullglob
          tests=(tools/reap_*regression.cpp)
          if (( ${#tests[@]} == 0 )); then
            echo 'No REAP regression tests found' >&2
            exit 1
          fi
          for source in "${tests[@]}"; do
            name="$(basename "${source}" .cpp)"
            echo "::group::${name}"
            g++ -std=c++17 -O2 -Wall -Wextra -pedantic -Isrc "${source}" -o "/tmp/rawrxd-reap-regressions/${name}"
            (cd /tmp/rawrxd-reap-regressions && "./${name}")
            echo "::endgroup::"
          done
  native-reap-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Compile and execute native REAP regressions on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\reap-tests" | Out-Null
          $sources = @(Get-ChildItem tools -Filter 'reap_*regression.cpp' -File)
          if ($sources.Count -eq 0) { throw 'No REAP regression tests found' }
          foreach ($source in $sources) {
            $name = [System.IO.Path]::GetFileNameWithoutExtension($source.Name)
            Write-Host "::group::$name"
            & cl.exe /nologo /std:c++17 /EHsc /O2 /W3 /I src /Fe:"$env:RUNNER_TEMP\reap-tests\$name.exe" $source.FullName
            if ($LASTEXITCODE -ne 0) { throw "Compilation failed: $name" }
            Push-Location "$env:RUNNER_TEMP\reap-tests"
            try {
              & ".\$name.exe"
              if ($LASTEXITCODE -ne 0) { throw "Regression failed: $name" }
            } finally { Pop-Location }
            Write-Host "::endgroup::"
          }
