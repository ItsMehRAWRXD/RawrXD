name: Extension policy smoke (model-free)
on:
  push:
    branches:
      - fix/deep2-multimodel-safety-20261025
    paths:
      - '~dev/rawrxd/src/core/extension_*policy.hpp'
      - '~dev/rawrxd/tests/extension_policy_smoke.cpp'
      - '~dev/rawrxd/src/core/extension_read_policy.hpp'
      - '~dev/rawrxd/tests/extension_read_smoke.cpp'
      - 'tests/extension_policy_smoke.cpp'
      - 'tools/ci/extension_policy_smoke.cpp'
      - 'tools/ci/extension_bridge_smoke.cpp'
      - 'tools/ci/test_extension_contract.py'
      - '~dev/rawrxd/src/core/js_extension_host*.cpp'
      - '.github/workflows/extension-policy-smoke.yml'
  pull_request:
    paths:
      - 'tests/extension_policy_smoke.cpp'
      - '~dev/rawrxd/src/core/extension_*policy.hpp'
      - '~dev/rawrxd/tests/extension_policy_smoke.cpp'
      - '~dev/rawrxd/tests/extension_read_smoke.cpp'
      - '~dev/rawrxd/src/core/extension_read_policy.hpp'
      - 'tools/ci/extension_policy_smoke.cpp'
      - 'tools/ci/extension_bridge_smoke.cpp'
      - 'tools/ci/test_extension_contract.py'
      - '~dev/rawrxd/src/core/js_extension_host*.cpp'
      - '.github/workflows/extension-policy-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile policy tests (GCC)
        run: g++ -std=c++17 -Wall -Wextra -Werror -pedantic '~dev/rawrxd/tests/extension_policy_smoke.cpp' -o /tmp/rawrxd-extension-policy-smoke
      - name: Execute policy assertions
        run: /tmp/rawrxd-extension-policy-smoke
      - name: Compile and execute production read-helper regression tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic '~dev/rawrxd/tests/extension_read_smoke.cpp' -o /tmp/rawrxd-extension-read-smoke
          /tmp/rawrxd-extension-read-smoke
      - name: Compile and run new policy edge-case gate
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -pedantic tests/extension_policy_smoke.cpp -o /tmp/rawrxd-extension-policy-edge
          /tmp/rawrxd-extension-policy-edge
      - name: Compile additional model-free policy fixtures
        run: g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I'~dev/rawrxd/src/core' tools/ci/extension_policy_smoke.cpp -o /tmp/rawrxd-extension-policy-extra
      - name: Execute additional policy fixtures
        run: /tmp/rawrxd-extension-policy-extra
      - name: Compile and execute C ABI bridge contract
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic '~dev/rawrxd/src/core/js_extension_host_production.cpp' tools/ci/extension_bridge_smoke.cpp -o /tmp/rawrxd-bridge-smoke
          /tmp/rawrxd-bridge-smoke
      - name: Source contract checks (not runtime certification)
        run: python3 tools/ci/test_extension_contract.py
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Compile policy tests (MSVC)
        shell: pwsh
        run: |
          cl /nologo /std:c++17 /EHsc /W4 /WX "~dev/rawrxd/tests/extension_policy_smoke.cpp" /Fe:"$env:RUNNER_TEMP/rawrxd-extension-policy-smoke.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile and execute production read-helper regression tests (MSVC)
        shell: pwsh
        run: |
          cl /nologo /std:c++17 /EHsc /W4 /WX "~dev/rawrxd/tests/extension_read_smoke.cpp" /Fe:"$env:RUNNER_TEMP/rawrxd-extension-read-smoke.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/rawrxd-extension-read-smoke.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile and execute policy edge cases (MSVC)
        shell: pwsh
        run: |
          cl /nologo /std:c++20 /EHsc /W4 /WX "tests/extension_policy_smoke.cpp" /Fe:"$env:RUNNER_TEMP/rawrxd-extension-policy-edge.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/rawrxd-extension-policy-edge.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile additional policy fixtures (MSVC)
        shell: pwsh
        run: |
          cl /nologo /std:c++17 /EHsc /W4 /WX /I "~dev/rawrxd/src/core" "tools/ci/extension_policy_smoke.cpp" /Fe:"$env:RUNNER_TEMP/rawrxd-extension-policy-extra.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute additional policy fixtures
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/rawrxd-extension-policy-extra.exe"
          exit $LASTEXITCODE
      - name: Execute policy assertions
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/rawrxd-extension-policy-smoke.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile and execute C ABI bridge contract
        shell: pwsh
        run: |
          cl /nologo /std:c++17 /EHsc /W4 /WX "~dev/rawrxd/src/core/js_extension_host_production.cpp" "tools/ci/extension_bridge_smoke.cpp" /Fe:"$env:RUNNER_TEMP/rawrxd-bridge-smoke.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/rawrxd-bridge-smoke.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Source contract checks (not runtime certification)
        shell: pwsh
        run: |
          python tools/ci/test_extension_contract.py
          exit $LASTEXITCODE
