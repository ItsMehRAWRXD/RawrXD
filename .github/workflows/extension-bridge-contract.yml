name: Extension bridge contract
on:
  push:
    branches: [audit/extension-contract-20261106]
  pull_request:
    paths:
      - '~dev/rawrxd/src/core/js_extension_host_production.cpp'
      - 'tests/extension/js_extension_bridge_contract_test.cpp'
      - '.github/workflows/extension-bridge-contract.yml'
  workflow_dispatch:
jobs:
  fail-closed-contract:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Audit extension source lanes (static-only)\n        shell: bash\n        run: python tests/extension/audit_extension_lanes.py\n      - name: Compile and execute extension policy acceptance (Linux)\n        if: runner.os == 'Linux'\n        shell: bash\n        run: |\n          mkdir -p build/extension-contract\n          c++ -std=c++17 -Wall -Wextra -Werror tests/extension/extension_policy_acceptance.cpp -o build/extension-contract/policy-test\n          build/extension-contract/policy-test\n      - name: Compile and execute extension policy acceptance (Windows)\n        if: runner.os == 'Windows'\n        shell: pwsh\n        run: |\n          New-Item -ItemType Directory -Force build/extension-contract | Out-Null\n          cl /nologo /EHsc /W4 /WX /std:c++17 '/Febuild/extension-contract/policy-test.exe' 'tests/extension/extension_policy_acceptance.cpp'\n          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\n          & 'build/extension-contract/policy-test.exe'\n          exit $LASTEXITCODE\n      - name: Compile and execute bridge contract (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p build/extension-contract
          c++ -std=c++17 -Wall -Wextra -Werror -pthread '~dev/rawrxd/src/core/js_extension_host_production.cpp' tests/extension/js_extension_bridge_contract_test.cpp -o build/extension-contract/bridge-test
          build/extension-contract/bridge-test
      - name: Compile and execute bridge contract (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/extension-contract | Out-Null
          cl /nologo /EHsc /W4 /WX /std:c++17 '/Febuild/extension-contract/bridge-test.exe' '~dev/rawrxd/src/core/js_extension_host_production.cpp' 'tests/extension/js_extension_bridge_contract_test.cpp'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & 'build/extension-contract/bridge-test.exe'
          exit $LASTEXITCODE
