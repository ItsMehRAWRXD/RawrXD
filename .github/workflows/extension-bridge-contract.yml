name: Extension bridge contract
on:
  push:
    branches: [audit/extension-contract-20261106]
  pull_request:
    paths:
      - '~dev/rawrxd/src/core/js_extension_host_production.cpp'
      - 'tests/extension/js_extension_bridge_contract_test.cpp'
      - '.github/workflows/extension-bridge-contract.yml'
  workflow_dispatch:
jobs:
  fail-closed-contract:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile and execute bridge contract (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p build/extension-contract
          c++ -std=c++17 -Wall -Wextra -Werror -pthread '~dev/rawrxd/src/core/js_extension_host_production.cpp' tests/extension/js_extension_bridge_contract_test.cpp -o build/extension-contract/bridge-test
          build/extension-contract/bridge-test
      - name: Compile and execute bridge contract (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/extension-contract | Out-Null
          cl /nologo /EHsc /W4 /WX /std:c++17 '/Febuild/extension-contract/bridge-test.exe' '~dev/rawrxd/src/core/js_extension_host_production.cpp' 'tests/extension/js_extension_bridge_contract_test.cpp'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & 'build/extension-contract/bridge-test.exe'
          exit $LASTEXITCODE
