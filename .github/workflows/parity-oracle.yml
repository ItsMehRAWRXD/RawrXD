name: Independent parity oracle
on:
  push:
    paths:
      - "tools/parity/**"
      - ".github/workflows/parity-oracle.yml"
  pull_request:
    paths:
      - "tools/parity/**"
      - ".github/workflows/parity-oracle.yml"
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run parity oracle unit tests
        run: python -m unittest discover -s tools/parity -p 'test_*.py' -v
