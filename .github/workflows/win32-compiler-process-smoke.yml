name: Win32 compiler subprocess smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/build/win32_compiler_process.hpp'
      - 'tests/win32_compiler_process_smoke.cpp'
      - '.github/workflows/win32-compiler-process-smoke.yml'
jobs:
  msvc-compile-link-run:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure MSVC environment and run smoke
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          cl /nologo /EHsc /std:c++17 /Fe:win32_compiler_process_smoke.exe tests\win32_compiler_process_smoke.cpp
          if errorlevel 1 exit /b 1
          win32_compiler_process_smoke.exe
          if errorlevel 1 exit /b 1
