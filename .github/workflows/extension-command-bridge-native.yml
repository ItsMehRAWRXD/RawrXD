name: Native extension command bridge acceptance
on:
  push:
    paths:
      - 'tools/acceptance/extension_command_bridge_native_test.cpp'
      - '~dev/rawrxd/src/core/extension_host_production.cpp'
      - '.github/workflows/extension-command-bridge-native.yml'
  pull_request:
    paths:
      - 'tools/acceptance/extension_command_bridge_native_test.cpp'
      - '~dev/rawrxd/src/core/extension_host_production.cpp'
      - '.github/workflows/extension-command-bridge-native.yml'
  workflow_dispatch:
jobs:
  native-extension-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile actual extension registry with warnings
        run: g++ -std=c++17 -Wall -Wextra -Werror -pthread -o /tmp/extension_bridge_test tools/acceptance/extension_command_bridge_native_test.cpp
      - name: Execute native lifecycle and reentrant callback assertions
        run: timeout 15s /tmp/extension_bridge_test
      - name: Build with address and undefined behavior sanitizers
        run: g++ -std=c++17 -Wall -Wextra -Werror -pthread -fsanitize=address,undefined -fno-omit-frame-pointer -o /tmp/extension_bridge_sanitized tools/acceptance/extension_command_bridge_native_test.cpp
      - name: Execute sanitizer-enabled acceptance
        run: timeout 15s /tmp/extension_bridge_sanitized
