name: Native extension command bridge acceptance
on:
  push:
    branches:
      - audit/mock-transport-20261106
  pull_request:
  workflow_dispatch:
jobs:
  native-extension-bridge:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check headless extension source contract (not runtime)
        run: python tools/acceptance/extension_headless_contract.py --json
      - name: Compile actual extension registry with warnings (Linux)
        if: runner.os == 'Linux'
        run: g++ -std=c++17 -Wall -Wextra -Werror -pthread -o /tmp/extension_bridge_test tools/acceptance/extension_command_bridge_native_test.cpp
      - name: Execute native lifecycle and reentrant callback assertions (Linux)
        if: runner.os == 'Linux'
        run: timeout 15s /tmp/extension_bridge_test
      - name: Compile and run compatibility JS bridge contract (Linux)
        if: runner.os == 'Linux'
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pthread -o /tmp/js_bridge_test tools/acceptance/js_extension_bridge_failclosed_test.cpp
          timeout 15s /tmp/js_bridge_test
      - name: Sanitize compatibility JS bridge contract (Linux)
        if: runner.os == 'Linux'
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pthread -fsanitize=address,undefined -fno-omit-frame-pointer -o /tmp/js_bridge_sanitized tools/acceptance/js_extension_bridge_failclosed_test.cpp
          timeout 15s /tmp/js_bridge_sanitized
      - name: Build with address and undefined behavior sanitizers (Linux)
        if: runner.os == 'Linux'
        run: g++ -std=c++17 -Wall -Wextra -Werror -pthread -fsanitize=address,undefined -fno-omit-frame-pointer -o /tmp/extension_bridge_sanitized tools/acceptance/extension_command_bridge_native_test.cpp
      - name: Execute sanitizer-enabled acceptance (Linux)
        if: runner.os == 'Linux'
        run: timeout 15s /tmp/extension_bridge_sanitized
      - name: Configure MSVC compiler environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Compile actual extension registry with MSVC (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: cl /nologo /std:c++17 /EHsc /W4 /WX /Fe:extension_bridge_test.exe tools\acceptance\extension_command_bridge_native_test.cpp
      - name: Compile compatibility JS bridge contract (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: cl /nologo /std:c++17 /EHsc /W4 /WX /Fe:js_bridge_test.exe tools\acceptance\js_extension_bridge_failclosed_test.cpp
      - name: Execute compatibility JS bridge contract (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & .\js_bridge_test.exe
          if ($LASTEXITCODE -ne 0) { throw "JS compatibility bridge contract failed" }
      - name: Execute native acceptance (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath '.\extension_bridge_test.exe' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Native acceptance failed with exit code $($p.ExitCode)" }
