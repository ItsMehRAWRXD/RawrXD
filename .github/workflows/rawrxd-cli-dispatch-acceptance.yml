name: RawrXD native CLI acceptance (manual)

on:
  workflow_dispatch:

jobs:
  windows-cli:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Configure native MSVC build
        shell: pwsh
        run: |
          cmake -S . -B build_ci_native -G "Visual Studio 17 2022" -A x64
      - name: Build CLI v2
        shell: pwsh
        run: |
          cmake --build build_ci_native --config Release --target RawrXD-CLI-V2 --parallel 2
      - name: Verify actual CLI dispatch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Get-ChildItem build_ci_native -Filter rawr.exe -Recurse -File |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) { throw "rawr.exe not produced" }
          Write-Host "Executable: $exe"
          Get-FileHash $exe -Algorithm SHA256 | Format-List
          $env:RAWRXD_CLI_DISPATCH_TRACE = "1"
          $doctor = & $exe doctor 2>&1 | Out-String
          Write-Host $doctor
          if ($doctor -notmatch '\[RAWRXD_CLI_V2_DISPATCH\] command=doctor') {
            throw "Wrong CLI entry point or dispatch trace absent"
          }
          if ($doctor -notmatch '=== RawrXD doctor ===') {
            throw "doctor did not run; usage is not acceptance"
          }
          $models = & $exe models 2>&1 | Out-String
          Write-Host $models
          if ($models -notmatch '\[RAWRXD_CLI_V2_DISPATCH\] command=models') {
            throw "models command did not reach CLI v2"
          }
          if ($models -match '(?m)^Usage:') {
            throw "models printed usage rather than dispatching"
          }
          # GitHub-hosted runners have no local Ollama/Deep2 service;
          # a classified backend-unavailable error is acceptable here.
          Remove-Item Env:\RAWRXD_CLI_DISPATCH_TRACE
