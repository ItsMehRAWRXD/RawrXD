name: REAP ROM parity standalone
on:
  workflow_dispatch:
  push:
    branches:
      - feature/reap-deepseek-671b-150tps
  pull_request:
jobs:
  portable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and execute dependency-free smoke tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rawrxd-reap
          for name in reap_rom_pinball_smoke reap_ternary_trace_smoke reap_projection_bridge_smoke reap_route_mask_smoke native_lsp_framing_smoke top25_parity_matrix_smoke; do
            g++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic -UNDEBUG "tests/${name}.cpp" -o "/tmp/rawrxd-reap/${name}"
            "/tmp/rawrxd-reap/${name}"
          done
  msvc:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Compile and execute dependency-free smoke tests (MSVC)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path "${env:ProgramFiles(x86)}" 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (!(Test-Path $vswhere)) { throw 'vswhere.exe missing' }
          $vsroot = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$vsroot) { throw 'MSVC toolchain not found' }
          $vcvars = Join-Path $vsroot 'VC\Auxiliary\Build\vcvars64.bat'
          if (!(Test-Path $vcvars)) { throw 'vcvars64.bat missing' }
          New-Item -ItemType Directory -Force build_reap | Out-Null
          $names = @('reap_rom_pinball_smoke', 'reap_ternary_trace_smoke', 'reap_projection_bridge_smoke', 'reap_route_mask_smoke', 'native_lsp_framing_smoke', 'top25_parity_matrix_smoke')
          foreach ($name in $names) {
            $cmdline = 'call "' + $vcvars + '" && cl /nologo /std:c++20 /EHsc /W4 /WX /UNDEBUG /Fe:build_reap\\' + $name + '.exe tests\\' + $name + '.cpp && build_reap\\' + $name + '.exe'
            & cmd.exe /d /s /c $cmdline
            if ($LASTEXITCODE -ne 0) { throw "MSVC smoke failed: $name (exit $LASTEXITCODE)" }
          }

  native-headless:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure RawrXD native x64 project (no Qt installation)
        shell: pwsh
        run: |
          cmake -S . -B build_native_ci -G "Visual Studio 17 2022" -A x64 -DRAWRXD_ENABLE_HARDENING=OFF -DRAWRXD_REQUIRE_QT=OFF -DUSE_ZLIB_FETCHCONTENT=OFF
          if ($LASTEXITCODE -ne 0) { throw "Native CMake configure failed: audit Qt/external dependencies" }
      - name: Build headless agent and snapshot targets
        shell: pwsh
        run: |
          cmake --build build_native_ci --config Release --target rawr-agent-headless rawr-snapshot --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Native headless build failed" }

  source-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Generate source-only IDE gap inventory
        run: |
          python3 tools/rawrxd_e2e_source_audit.py
          python3 tools/rawrxd_no_deps_audit.py
          python3 tools/rawrxd_per_file_source_audit.py --strict-missing
          python3 tools/rawrxd_cmake_source_admission.py
          python3 -m py_compile tools/rawrxd_cmake_source_admission.py tools/rawrxd_per_file_source_audit.py tools/rawrxd_e2e_source_audit.py tools/rawrxd_no_deps_audit.py
      - name: Upload machine-readable audit
        uses: actions/upload-artifact@v4
        with:
          name: rawrxd-e2e-source-audit
          path: |
            evidence/rawrxd_e2e_source_audit.json
            evidence/rawrxd_no_deps_audit.json
            evidence/rawrxd_per_file_source_audit.json
            evidence/rawrxd_cmake_source_admission.json

  native-ide:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Configure no-Qt native IDE
        shell: pwsh
        run: |
          cmake -S . -B build_native_ide_ci -G "Visual Studio 17 2022" -A x64 -DRAWRXD_REQUIRE_QT=OFF -DUSE_ZLIB_FETCHCONTENT=OFF -DENABLE_VULKAN=OFF -DGGML_VULKAN=OFF
          if ($LASTEXITCODE -ne 0) { throw "Native IDE configure failed" }
      - name: Audit native IDE CMake dependency resolution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cache = Get-Content build_native_ide_ci/CMakeCache.txt
          $qt = $cache | Select-String -Pattern '^RAWRXD_REQUIRE_QT:BOOL=ON        shell: pwsh
        run: |
          cmake --build build_native_ide_ci --config Release --target RawrXD-Win32IDE-Native --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Native Win32 IDE build failed" }
      - name: Check built native IDE artifact exists
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem -Path build_native_ide_ci -Filter 'RawrXD-Win32IDE-Native.exe' -Recurse -File | Select-Object -First 1
          if (!$exe) { throw 'Native IDE target returned success without expected executable' }
          if ($exe.Length -lt 4096) { throw "Native IDE executable unexpectedly small: $($exe.Length) bytes" }
          Write-Host "Native IDE artifact: $($exe.FullName), bytes=$($exe.Length)"
      - name: Upload executable and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rawrxd-native-ide-build
          path: |
            build_native_ide_ci/**/Release/RawrXD-Win32IDE-Native.exe
            build_native_ide_ci/**/RawrXD-Win32IDE-Native.exe
          if-no-files-found: error

          if ($qt) { throw 'Qt requirement unexpectedly enabled in native IDE build' }
          if (!(Test-Path build_native_ide_ci/CMakeCache.txt)) { throw 'Missing CMake configuration evidence' }
      - name: Build real Win32 IDE executable
        shell: pwsh
        run: |
          cmake --build build_native_ide_ci --config Release --target RawrXD-Win32IDE-Native --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Native Win32 IDE build failed" }
      - name: Check built native IDE artifact exists
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem -Path build_native_ide_ci -Filter 'RawrXD-Win32IDE-Native.exe' -Recurse -File | Select-Object -First 1
          if (!$exe) { throw 'Native IDE target returned success without expected executable' }
          if ($exe.Length -lt 4096) { throw "Native IDE executable unexpectedly small: $($exe.Length) bytes" }
          Write-Host "Native IDE artifact: $($exe.FullName), bytes=$($exe.Length)"
      - name: Upload executable and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rawrxd-native-ide-build
          path: |
            build_native_ide_ci/**/Release/RawrXD-Win32IDE-Native.exe
            build_native_ide_ci/**/RawrXD-Win32IDE-Native.exe
          if-no-files-found: error
