name: RawrXD Wiring Digest

on:
  push:
    paths:
      - 'scripts/*.psm1'
      - 'scripts/*.ps1'
      - '.github/workflows/wiring-digest.yml'
  pull_request:
    paths:
      - 'scripts/*.psm1'
      - 'scripts/*.ps1'
  workflow_dispatch:

jobs:
  wiring-validation:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - name: Run Source Wiring Digest
        id: digest
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Continue'
          $root = $env:GITHUB_WORKSPACE
          $digestPath = Join-Path $root 'scripts\SourceWiringDigest.ps1'
          if (-not (Test-Path $digestPath)) { throw "Digest script not found: $digestPath" }

          & $digestPath -RootPath $root -ModuleDir (Join-Path $root 'scripts') `
            -ScanRoots @('scripts','include','cmake','.github') `
            -MaxScanFiles 8000 -RulesProfile default -WarnOnly
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) {
            Write-Warning "Digest exited $LASTEXITCODE (WarnOnly — continuing)"
          }

          $reportPath = Join-Path $root 'WIRING_DIGEST_REPORT.md'
          if (-not (Test-Path $reportPath)) {
            Write-Warning "Digest report not found: $reportPath"
            "unwired_count=-1" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "packaging_risk=-1" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }

          $report = Get-Content $reportPath
          $unwiredIndex = ($report | Select-String '^## Unwired Modules' -List).LineNumber
          $nextHeader = ($report | Select-String '^## ' | Where-Object { $_.LineNumber -gt $unwiredIndex } | Select-Object -First 1).LineNumber
          if (-not $nextHeader) { $nextHeader = $report.Count + 1 }

          $unwiredLines = @()
          if ($unwiredIndex) {
            $unwiredLines = $report[($unwiredIndex)..($nextHeader - 2)] | Where-Object { $_ -match '^-\s+' }
          }
          $unwiredCount = @($unwiredLines).Count

          $riskLine = ($report | Select-String '^- Packaging risk score:' -List).Line
          $riskScore = 0
          if ($riskLine -match '(\d+)') { $riskScore = [int]$Matches[1] }

          "unwired_count=$unwiredCount" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "packaging_risk=$riskScore" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          if ($unwiredCount -gt 0) { Write-Warning "Unwired modules: $unwiredCount (informational)" }
          if ($riskScore -gt 250) { Write-Warning "High packaging risk: $riskScore" }

      - name: Verify Module Loading
        run: |
          $scriptDir = Join-Path $env:GITHUB_WORKSPACE 'scripts'
          Set-Location $scriptDir
          @('DependencyManager', 'PerformanceFramework', 'SecurityFramework') | ForEach-Object {
            $modulePath = Join-Path $scriptDir "$_.psm1"
            if (-not (Test-Path $modulePath)) { throw "$_.psm1 not found" }
            Import-Module $modulePath -Force
            if (-not (Get-Module $_)) { throw "$_ not loaded" }
            Write-Host "$_ loaded"
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wiring-report
          path: WIRING_DIGEST_REPORT.md
          retention-days: 30
