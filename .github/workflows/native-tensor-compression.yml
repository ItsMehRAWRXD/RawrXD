name: Native tensor compression
on:
  push:
    branches: [feat/native-tensor-compression-20261122]
  pull_request:
    paths:
      - 'src/deep2/NativeTensorCompression.hpp'
      - 'src/deep2/NativeTensorResidencyCache.hpp'
      - 'tests/deep2/native_tensor_residency_cache_test.cpp'
      - 'src/Deep2Engine.hpp'
      - 'src/Deep2Engine.cpp'
      - 'src/TensorView.hpp'
      - 'src/TensorROM.cpp'
      - 'src/quant_kernels.hpp'
      - 'src/quant_kernels.cpp'
      - 'tests/deep2/native_quantized_tile_range_test.cpp'
      - 'src/deep2/NativeKQuant.hpp'
      - 'tests/deep2/native_k_quant_test.cpp'
      - 'tests/deep2/native_gguf_k_integration.py'
      - 'tests/deep2/native_loader_k_geometry_test.cpp'
      - 'tests/deep2/native_q5k_runtime_layout_test.cpp'
      - '~dev/rawrxd/src/deep2/NativeQ5KDecode.hpp'
      - '~dev/rawrxd/src/deep2/QuantKernelRegistry.cpp'
      - '~dev/rawrxd/src/deep2/GGUFLoader.hpp'
      - 'tools/native_tensor_pack.cpp'
      - 'tests/deep2/native_tensor_compression_test.cpp'
      - 'tests/deep2/native_gguf_f16_integration.py'
      - 'tools/native_gguf_f16.cpp'
      - '.github/workflows/native-tensor-compression.yml'
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -Werror tests/deep2/native_tensor_compression_test.cpp -o tensor_test
          ./tensor_test
          c++ -std=c++17 -O2 -Wall -Wextra -Werror tests/deep2/native_tensor_residency_cache_test.cpp -o residency_cache_test
          ./residency_cache_test
          c++ -std=c++17 -O2 -Wall -Wextra -Werror tests/deep2/native_k_quant_test.cpp -o native_k_test
          ./native_k_test
          c++ -std=c++17 -O2 -Wall -Wextra -Werror tests/deep2/native_loader_k_geometry_test.cpp -o native_loader_k_test
          ./native_loader_k_test
          c++ -std=c++17 -O2 -Wall -Wextra -Werror tests/deep2/native_q5k_runtime_layout_test.cpp -o native_q5k_test
          ./native_q5k_test
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -Isrc tests/deep2/native_quantized_tile_range_test.cpp src/quant_kernels.cpp -o quantized_tile_range_test
          ./quantized_tile_range_test
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -Isrc -c src/TensorROM.cpp -o tensor_rom.o
          c++ -std=c++17 -O2 -Wall -Wextra -Werror tools/native_gguf_f16.cpp -o native_gguf_f16
          python3 tests/deep2/native_gguf_f16_integration.py ./native_gguf_f16
          python3 tests/deep2/native_gguf_k_integration.py ./native_gguf_f16
          c++ -std=c++17 -O2 -Wall -Wextra -Werror tools/native_tensor_pack.cpp -o tensor_pack
          python3 -c "from pathlib import Path; Path('input.bin').write_bytes(bytes(range(256))*4096 + b'Z'*100000)"
          ./tensor_pack pack input.bin compressed.rxtc
          ./tensor_pack unpack compressed.rxtc restored.bin
          cmp input.bin restored.bin
          python3 -c "from pathlib import Path; p=Path('compressed.rxtc'); b=bytearray(p.read_bytes()); b[35]^=1; Path('corrupt.rxtc').write_bytes(b)"
          if ./tensor_pack unpack corrupt.rxtc corrupt.out; then exit 1; fi
      - name: Enable MSVC build environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Compile and test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cl /nologo /EHsc /std:c++17 /O2 tests/deep2/native_tensor_compression_test.cpp /Fe:tensor_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\tensor_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cl /nologo /EHsc /std:c++17 /O2 tests/deep2/native_tensor_residency_cache_test.cpp /Fe:residency_cache_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\residency_cache_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cl /nologo /EHsc /std:c++17 /O2 tests/deep2/native_k_quant_test.cpp /Fe:native_k_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\native_k_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cl /nologo /EHsc /std:c++17 /O2 tests/deep2/native_loader_k_geometry_test.cpp /Fe:native_loader_k_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\native_loader_k_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cl /nologo /EHsc /std:c++17 /O2 tests/deep2/native_q5k_runtime_layout_test.cpp /Fe:native_q5k_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\native_q5k_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cl /nologo /EHsc /std:c++17 /O2 /Isrc tests/deep2/native_quantized_tile_range_test.cpp src/quant_kernels.cpp /Fe:quantized_tile_range_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\quantized_tile_range_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cl /nologo /EHsc /std:c++17 /O2 /Isrc /c src/TensorROM.cpp /Fotensor_rom.obj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cl /nologo /EHsc /std:c++17 /O2 tools/native_gguf_f16.cpp /Fe:native_gguf_f16.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/deep2/native_gguf_f16_integration.py .\\native_gguf_f16.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/deep2/native_gguf_k_integration.py .\\native_gguf_f16.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cl /nologo /EHsc /std:c++17 /O2 tools/native_tensor_pack.cpp /Fe:tensor_pack.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "from pathlib import Path; Path('input.bin').write_bytes(bytes(range(256))*4096 + b'Z'*100000)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\tensor_pack.exe pack input.bin compressed.rxtc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\tensor_pack.exe unpack compressed.rxtc restored.bin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash input.bin).Hash -ne (Get-FileHash restored.bin).Hash) { exit 1 }
          python -c "from pathlib import Path; p=Path('compressed.rxtc'); b=bytearray(p.read_bytes()); b[35]^=1; Path('corrupt.rxtc').write_bytes(b)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\\tensor_pack.exe unpack corrupt.rxtc corrupt.out
          if ($LASTEXITCODE -eq 0) { throw 'corrupt archive was accepted' }
