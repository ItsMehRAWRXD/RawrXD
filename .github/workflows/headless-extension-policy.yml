name: Headless extension policy gates
on:
  push:
    paths:
      - 'tests/extension_policy_smoke.cpp'
      - 'tests/headless_mock_protocol_smoke.py'
      - '~dev/rawrxd/src/core/extension_entry_policy.hpp'
      - '~dev/rawrxd/src/core/extension_manifest_policy.hpp'
      - '~dev/rawrxd/src/core/extension_read_policy.hpp'
      - '.github/workflows/headless-extension-policy.yml'
  pull_request:
  workflow_dispatch:

jobs:
  extension-policy:
    name: Extension policy (real headers, no model)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          clean: false
      - name: Compile production-header policy gate
        run: |
          c++ -std=c++20 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/extension_policy_smoke.cpp -o /tmp/rawrxd_extension_policy_gate
      - name: Execute production-header policy gate
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: /tmp/rawrxd_extension_policy_gate
      - name: Run isolated mock-protocol fixture (not product integration)
        run: python3 -m unittest -v tests/headless_mock_protocol_smoke.py
      - name: Guard checkout cleanup for undeclared legacy evidence gitlink
        if: always()
        shell: bash
        run: |
          # Supply runner-local metadata only for gitlinks missing from .gitmodules.
          # file:///dev/null is never fetched: foreach skips uninitialized entries.
          git ls-files --stage | awk '$1 == "160000" {print $4}' | while IFS= read -r path; do
            mapped_paths="$(git config --file .gitmodules --get-regexp '^submodule\\..*\\.path
 2>/dev/null | sed 's/^[^ ]* //')"
            if ! printf '%s\\n' "$mapped_paths" | grep -Fqx "$path"; then
              key="$(printf '%s' "$path" | sed 's/[^A-Za-z0-9]/-/g')"
              git config --file .gitmodules "submodule.ci-orphaned-$key.path" "$path"
              git config --file .gitmodules "submodule.ci-orphaned-$key.url" "file:///dev/null"
            fi
          done
