name: Deep2 synthetic GGUF model end-to-end

on:
  push:
    branches:
      - feat/native-universal-compression-expansion-20261123-v2
    paths:
      - '~dev/rawrxd/tests/deep2_synthetic_runtime/CMakeLists.txt'
      - '~dev/rawrxd/tests/native_deep2_gguf_model_e2e_test.cpp'
      - '~dev/rawrxd/src/deep2/Deep2Engine.cpp'
      - '~dev/rawrxd/src/deep2/Deep2Engine.h'
      - '~dev/rawrxd/src/deep2/Deep2Engine_GpuForward.cpp'
      - '~dev/rawrxd/src/deep2/Deep2Engine_GpuMoEMLA.cpp'
      - '~dev/rawrxd/src/deep2/Deep2Engine_VulkanRuntime.cpp'
      - '~dev/rawrxd/src/deep2/Deep2DualGpuRowSplit.cpp'
      - '~dev/rawrxd/src/deep2/Deep2DualGpuBalancer.cpp'
      - '~dev/rawrxd/src/deep2/Deep2MultiGpuLayerPlan.cpp'
      - '~dev/rawrxd/src/deep2/vulkan_compute.cpp'
      - '~dev/rawrxd/src/deep2/NativeTensorCompression.hpp'
      - '~dev/rawrxd/src/deep2/GGUFLoader.hpp'
      - '.github/workflows/deep2-synthetic-gguf-e2e.yml'
  pull_request:
    paths:
      - '~dev/rawrxd/tests/deep2_synthetic_runtime/CMakeLists.txt'
      - '~dev/rawrxd/tests/native_deep2_gguf_model_e2e_test.cpp'
      - '~dev/rawrxd/src/deep2/Deep2Engine.cpp'
      - '~dev/rawrxd/src/deep2/Deep2Engine.h'
      - '~dev/rawrxd/src/deep2/Deep2Engine_GpuForward.cpp'
      - '~dev/rawrxd/src/deep2/Deep2Engine_GpuMoEMLA.cpp'
      - '~dev/rawrxd/src/deep2/Deep2Engine_VulkanRuntime.cpp'
      - '~dev/rawrxd/src/deep2/Deep2DualGpuRowSplit.cpp'
      - '~dev/rawrxd/src/deep2/Deep2DualGpuBalancer.cpp'
      - '~dev/rawrxd/src/deep2/Deep2MultiGpuLayerPlan.cpp'
      - '~dev/rawrxd/src/deep2/vulkan_compute.cpp'
      - '~dev/rawrxd/src/deep2/NativeTensorCompression.hpp'
      - '~dev/rawrxd/src/deep2/GGUFLoader.hpp'
      - '.github/workflows/deep2-synthetic-gguf-e2e.yml'
  workflow_dispatch:

jobs:
  deep2-synthetic-gguf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Vulkan headers and runtime loader
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libvulkan-dev libvulkan1
      - name: Configure focused production Deep2 E2E target
        run: |
          cmake -S "~dev/rawrxd/tests/deep2_synthetic_runtime" -B build-deep2-e2e -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Compile production Deep2 engine and synthetic GGUF test
        run: |
          cmake --build build-deep2-e2e --parallel 4
      - name: Run actual GGUF load, compressed residency, and generation
        run: |
          ./build-deep2-e2e/rawrxd-native-deep2-gguf-model-e2e-test
