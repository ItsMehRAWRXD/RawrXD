name: CI - Quality Gates

on:
  push:
    branches:
      - main
      - master
      - dev
      - release/**
      - hotfix/**
  pull_request:
    branches:
      - main
      - master
      - release/**
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  # Quick smoke check
  quick-check:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    
    - name: Check file structure
      run: |
        test -f CMakeLists.txt || (echo "Missing CMakeLists.txt" && exit 1)
        test -d include/rawrxd || (echo "Missing public headers" && exit 1)
        test -f API_FREEZE.md || (echo "Missing API_FREEZE.md" && exit 1)
        echo "✓ Repository structure valid"
    
    - name: Check version consistency
      run: |
        VERSION=$(grep -oP 'RAWRXD_VERSION "\K[^"]+' include/rawrxd/Version.hpp 2>/dev/null || echo "unknown")
        echo "RawrXD Version: $VERSION"
        echo "version=$VERSION" >> $GITHUB_OUTPUT

  # Build on multiple platforms
  build:
    needs: quick-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc
            cc: gcc
            cxx: g++
          - os: ubuntu-22.04
            compiler: clang
            cc: clang
            cxx: clang++
          - os: windows-2022
            compiler: msvc
          - os: macos-13
            compiler: clang
            cc: clang
            cxx: clang++
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup Linux
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build
        if [ "${{ matrix.compiler }}" = "clang" ]; then
          sudo apt-get install -y clang
        fi
    
    - name: Setup Windows
      if: runner.os == 'Windows'
      uses: microsoft/setup-msbuild@v2
    
    - name: Setup Windows dependencies
      if: runner.os == 'Windows'
      run: |
        choco install nasm -y
        pip install aqtinstall
        python -m aqt install-qt windows desktop 6.5.2 win64_msvc2019_64
      shell: pwsh
    
    - name: Setup macOS
      if: runner.os == 'macOS'
      run: brew install cmake ninja
    
    - name: Configure (Unix)
      if: runner.os != 'Windows'
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_C_COMPILER=${{ matrix.cc }} \
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
          -DRAWRXD_BUILD_TESTS=ON \
          -GNinja
      env:
        CC: ${{ matrix.cc }}
        CXX: ${{ matrix.cxx }}
    
    - name: Configure (Windows)
      if: runner.os == 'Windows'
      run: |
        $QtBase = Join-Path $PWD "Qt\6.5.2\msvc2019_64"
        cmake -B build `
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
          -DRAWRXD_BUILD_TESTS=ON `
          -DQt6_DIR="$QtBase\lib\cmake\Qt6"
      shell: pwsh
    
    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-${{ matrix.os }}-${{ matrix.compiler }}
        path: build/bin
        retention-days: 1

  # Unit tests with coverage
  test:
    needs: build
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build gcovr
    
    - name: Configure
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Debug \
          -DRAWRXD_BUILD_TESTS=ON \
          -DRAWRXD_ENABLE_COVERAGE=ON \
          -GNinja
    
    - name: Build
      run: cmake --build build --parallel
    
    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure -j$(nproc)
    
    - name: Generate coverage
      run: |
        cd build
        gcovr -r .. --xml -o coverage.xml --exclude='.*test.*' --exclude='.*_deps.*'
    
    - name: Check coverage threshold
      run: |
        COVERAGE=$(grep -oP 'line-rate="\K[^"]+' build/coverage.xml | head -1)
        COVERAGE_PCT=$(echo "$COVERAGE * 100" | bc)
        echo "Coverage: ${COVERAGE_PCT}%"
        if (( $(echo "$COVERAGE_PCT < 80" | bc -l) )); then
          echo "::error::Coverage below 80% threshold"
          exit 1
        fi
    
    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        files: build/coverage.xml
        fail_ci_if_error: false

  # Smoke tests
  smoke-test:
    needs: build
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build
    
    - name: Configure
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DRAWRXD_BUILD_TESTS=ON \
          -GNinja
    
    - name: Build
      run: cmake --build build --parallel
    
    - name: Run smoke tests
      run: |
        cd build
        ctest -R smoke --output-on-failure

  # Benchmark regression check
  benchmark:
    needs: build
    runs-on: ubuntu-22.04
    if: github.event_name == 'pull_request'
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build
    
    - name: Build PR branch
      run: |
        cmake -B build_pr -DCMAKE_BUILD_TYPE=Release -DRAWRXD_BUILD_BENCHMARKS=ON -GNinja
        cmake --build build_pr --parallel
    
    - name: Run PR benchmarks
      run: |
        cd build_pr
        ./bin/benchmark_core --benchmark_out=pr_results.json --benchmark_out_format=json
    
    - name: Checkout main
      run: |
        git stash
        git checkout origin/main
    
    - name: Build main branch
      run: |
        cmake -B build_main -DCMAKE_BUILD_TYPE=Release -DRAWRXD_BUILD_BENCHMARKS=ON -GNinja
        cmake --build build_main --parallel
    
    - name: Run main benchmarks
      run: |
        cd build_main
        ./bin/benchmark_core --benchmark_out=main_results.json --benchmark_out_format=json
    
    - name: Compare benchmarks
      run: |
        python3 scripts/compare_benchmarks.py \
          build_main/main_results.json \
          build_pr/pr_results.json \
          --threshold=1.1

  # Static analysis
  static-analysis:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build clang-tidy cppcheck
    
    - name: Configure
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_CXX_CLANG_TIDY="clang-tidy;-warnings-as-errors=*" \
          -GNinja
    
    - name: Run clang-tidy
      run: |
        cmake --build build 2>&1 | tee clang-tidy.log
        if grep -q "error:" clang-tidy.log; then
          echo "::error::clang-tidy found errors"
          exit 1
        fi
    
    - name: Run cppcheck
      run: |
        cppcheck --enable=all --error-exitcode=1 \
          --suppress=missingIncludeSystem \
          --suppress=unmatchedSuppression \
          -I include src 2>&1 | tee cppcheck.log
    
    - name: Upload analysis results
      uses: actions/upload-artifact@v4
      with:
        name: static-analysis
        path: |
          clang-tidy.log
          cppcheck.log
        retention-days: 7

  # Security scan
  security:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: cpp
        queries: security-extended
    
    - name: Autobuild
      uses: github/codeql-action/autobuild@v3
    
    - name: Analyze
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:cpp"

  # Documentation check
  docs:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Check documentation
      run: |
        # Check for required docs
        test -f README.md || (echo "::error::Missing README.md" && exit 1)
        test -f CONTRIBUTING.md || (echo "::error::Missing CONTRIBUTING.md" && exit 1)
        test -f SECURITY.md || (echo "::error::Missing SECURITY.md" && exit 1)
        test -f API_FREEZE.md || (echo "::error::Missing API_FREEZE.md" && exit 1)
        
        # Check CHANGELOG updated on PR
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          git fetch origin ${{ github.base_ref }}
          if ! git diff --name-only origin/${{ github.base_ref }} | grep -q CHANGELOG.md; then
            echo "::warning::CHANGELOG.md not updated in this PR"
          fi
        fi
        
        echo "✓ Documentation checks passed"

  # Summary
  summary:
    needs: [quick-check, build, test, smoke-test, benchmark, static-analysis, security, docs]
    runs-on: ubuntu-22.04
    if: always()
    
    steps:
    - name: Generate Summary
      run: |
        echo "## CI Quality Gates Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Gate | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Quick Check | ${{ needs.quick-check.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Build (Multi-platform) | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Unit Tests + Coverage | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Smoke Tests | ${{ needs.smoke-test.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Benchmark Regression | ${{ needs.benchmark.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Static Analysis | ${{ needs.static-analysis.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Security Scan | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Documentation | ${{ needs.docs.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Overall status
        if [ "${{ needs.quick-check.result }}" = "success" ] && \
           [ "${{ needs.build.result }}" = "success" ] && \
           [ "${{ needs.test.result }}" = "success" ] && \
           [ "${{ needs.smoke-test.result }}" = "success" ] && \
           [ "${{ needs.static-analysis.result }}" = "success" ] && \
           [ "${{ needs.security.result }}" = "success" ] && \
           [ "${{ needs.docs.result }}" = "success" ]; then
          echo "### ✅ All Quality Gates Passed" >> $GITHUB_STEP_SUMMARY
        else
          echo "### ❌ Some Quality Gates Failed" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi
