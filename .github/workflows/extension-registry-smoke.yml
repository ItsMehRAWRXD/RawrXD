name: Extension registry headless smoke

on:
  push:
    paths:
      - 'tests/extension_command_registry_smoke.cpp'
      - '~dev/rawrxd/src/core/extension_host_production.cpp'
      - '.github/workflows/extension-registry-smoke.yml'
  pull_request:
    paths:
      - 'tests/extension_command_registry_smoke.cpp'
      - '~dev/rawrxd/src/core/extension_host_production.cpp'
      - '.github/workflows/extension-registry-smoke.yml'
  workflow_dispatch:

jobs:
  extension-registry:
    name: C++17 deterministic registry acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile with strict warnings
        run: |
          c++ -std=c++17 -O1 -Wall -Wextra -Werror -pedantic -pthread \
            tests/extension_command_registry_smoke.cpp -o extension_registry_smoke
      - name: Execute assertions (no model required)
        run: ./extension_registry_smoke
