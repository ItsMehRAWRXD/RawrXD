name: RawrXD dual AMD GPU admission (self-hosted only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rawrxd-dual-gpu-admission
  cancel-in-progress: false
jobs:
  dual-gpu-admission:
    runs-on: [self-hosted, Windows, X64, rawrxd-dual-amd]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read-only GPU and Vulkan inventory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gpus = @(Get-CimInstance Win32_VideoController | Where-Object { $_.Name -match 'AMD|Radeon' })
          $gpus | Select-Object Name, DriverVersion, Status | Format-Table -AutoSize
          $r9700 = @($gpus | Where-Object { $_.Name -match 'R9700' })
          $rx7800 = @($gpus | Where-Object { $_.Name -match '7800 XT' })
          if ($r9700.Count -ne 1 -or $rx7800.Count -ne 1) {
            throw "Expected one R9700 and one RX 7800 XT; integrated GPU does not count"
          }
          $vulkan = Get-Command vulkaninfo.exe -ErrorAction SilentlyContinue
          if (-not $vulkan) { throw "Vulkan SDK utility vulkaninfo.exe missing" }
          & $vulkan.Source --summary
          if ($LASTEXITCODE -ne 0) { throw "Vulkan device enumeration failed" }
      - name: Verify source test suite with local MSVC (no model loads)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path "${env:ProgramFiles(x86)}" 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (!(Test-Path $vswhere)) { throw "vswhere.exe missing" }
          $vs = & $vswhere -latest -products '*' -property installationPath
          if (!$vs) { throw "Visual Studio toolchain missing" }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          if (!(Test-Path $vcvars)) { throw "vcvars64.bat missing" }
          New-Item -ItemType Directory -Force build_reap | Out-Null
          foreach ($name in @('reap_rom_pinball_smoke','reap_ternary_trace_smoke','reap_projection_bridge_smoke','reap_route_mask_smoke','native_lsp_framing_smoke','top25_parity_matrix_smoke')) {
            $cmd = 'call "' + $vcvars + '" && cl /nologo /std:c++20 /EHsc /W4 /WX /Fe:build_reap\' + $name + '.exe tests\' + $name + '.cpp && build_reap\' + $name + '.exe'
            cmd.exe /d /s /c $cmd
            if ($LASTEXITCODE -ne 0) { throw "Smoke test failed: $name" }
          }
