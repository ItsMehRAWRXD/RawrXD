name: Headless extension acceptance
on:
  push:
    paths:
      - 'tests/headless/**'
      - 'tools/native_build_bridge.py'
      - '~dev/rawrxd/src/core/extension_host_production.cpp'
      - '~dev/rawrxd/src/core/js_extension_host.cpp'
      - '.github/workflows/headless-extension-sim.yml'
  pull_request:
    paths:
      - 'tests/headless/**'
      - 'tools/native_build_bridge.py'
      - '~dev/rawrxd/src/core/extension_host_production.cpp'
      - '~dev/rawrxd/src/core/js_extension_host.cpp'
      - '.github/workflows/headless-extension-sim.yml'
  workflow_dispatch:

jobs:
  simulator-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic extension simulator assertions
        run: python -m unittest discover -s tests/headless -p 'test_extension_lifecycle_sim.py' -v

  production-command-bridge-sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Compile production bridge with address and undefined behavior sanitizers
        run: g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -pedantic -pthread -fsanitize=address,undefined -fno-omit-frame-pointer tests/headless/test_extension_command_bridge.cpp -o /tmp/rawrxd-extension-asan
      - name: Run production bridge under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: /tmp/rawrxd-extension-asan

  production-command-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile real production command bridge
        run: g++ -std=c++17 -Wall -Wextra -pedantic -pthread tests/headless/test_extension_command_bridge.cpp -o /tmp/rawrxd-extension-command-smoke
      - name: Run 45 production command bridge acceptance cases
        run: /tmp/rawrxd-extension-command-smoke

  native-compiler-linker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and link real C++ fixtures through the offline build adapter
        run: python -m unittest discover -s tests/headless -p 'test_native_build_bridge.py' -v

  windows-native-compiler-linker:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Initialize MSVC environment and run real C/C++ compile-link-execute tests
        shell: cmd
        run: |
          for /f "usebackq delims=" %%I in (`"%ProgramFiles(x86)%\\Microsoft Visual Studio\\Installer\\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%I"
          if not defined VSROOT exit /b 1
          call "%VSROOT%\\VC\\Auxiliary\\Build\\vcvars64.bat"
          if errorlevel 1 exit /b 1
          python -m unittest discover -s tests/headless -p test_native_build_bridge.py -v
