name: REAP native regression
on:
  push:
    branches: [codex/reap-native-r01-gguf-parser]
    paths: ['src/reap/**', 'tools/reap_*', '.github/workflows/reap-native-regression.yml']
  pull_request:
    paths: ['src/reap/**', 'tools/reap_*', '.github/workflows/reap-native-regression.yml']
  workflow_dispatch:
jobs:
  standalone:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile and execute native C++17 REAP regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reap-test-bin
          for name in reap_k_row_layout_regression reap_atomic_failure_regression reap_q8k_scale_overflow_regression reap_q8k_underflow_regression reap_q8k_quality_select_regression reap_q8k_nonfinite_regression reap_q8k_row_guard_regression reap_q81_nonfinite_regression reap_auto_q6_sensitive_regression reap_q8k_exact_codes_regression reap_q81_exact_codes_regression reap_q4_no_expansion_regression reap_q81_signed_scale_regression reap_q8_strict_shrink_regression reap_auto_no_expansion_regression reap_auto_select_regression reap_q81_to_q80_regression reap_q4_protection_integration reap_q4_protected_tensors_regression reap_f16_guard_regression reap_q5k_to_q4_regression reap_q6k_to_q5_regression reap_q6k_to_q4_regression reap_q8k_to_q8_regression reap_q8k_to_q4_regression reap_float_to_q4_regression reap_q8_1_to_q4_regression reap_affine_q4_regression reap_q5_to_q4_regression reap_row_alignment_regression reap_q4_0_regression reap_q8_0_regression reap_sha256_regression reap_float16_regression reap_f16_gguf_regression reap_f16_accuracy_regression reap_repacker_regression reap_planner_regression reap_publisher_regression reap_blob_regression; do
            echo "Compiling $name"
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              g++ -std=c++17 -O2 -Wall -Wextra -pthread -I src "tools/$name.cpp" -o "reap-test-bin/$name.exe"
              "./reap-test-bin/$name.exe"
            else
              g++ -std=c++17 -O2 -Wall -Wextra -pthread -I src "tools/$name.cpp" -o "reap-test-bin/$name"
              "./reap-test-bin/$name"
            fi
          done
          echo "Compiling native REAP repack CLI (all compression modes)"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            g++ -std=c++17 -O2 -Wall -Wextra -pthread -I src tools/reap_repack_cli.cpp -o reap-test-bin/reap_repack_cli.exe
            if ./reap-test-bin/reap_repack_cli.exe >/dev/null 2>&1; then
              echo "FAIL: missing CLI arguments accepted"; exit 1
            fi
          else
            g++ -std=c++17 -O2 -Wall -Wextra -pthread -I src tools/reap_repack_cli.cpp -o reap-test-bin/reap_repack_cli
            if ./reap-test-bin/reap_repack_cli >/dev/null 2>&1; then
              echo "FAIL: missing CLI arguments accepted"; exit 1
            fi
          fi
          echo "Compiling gguf_parser_regression"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            g++ -std=c++17 -O2 -Wall -Wextra -pthread -I src "tools/gguf_parser_regression.cpp" src/GGUFLoader.cpp -o "reap-test-bin/gguf_parser_regression.exe"
            "./reap-test-bin/gguf_parser_regression.exe"
          else
            g++ -std=c++17 -O2 -Wall -Wextra -pthread -I src "tools/gguf_parser_regression.cpp" src/GGUFLoader.cpp -o "reap-test-bin/gguf_parser_regression"
            "./reap-test-bin/gguf_parser_regression"
          fi
          echo "Compiling native F16 accuracy audit CLI"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            g++ -std=c++17 -O2 -Wall -Wextra -I src "tools/reap_f16_audit_cli.cpp" -o "reap-test-bin/reap_f16_audit_cli.exe"
          else
            g++ -std=c++17 -O2 -Wall -Wextra -I src "tools/reap_f16_audit_cli.cpp" -o "reap-test-bin/reap_f16_audit_cli"
          fi
          # Two FP32 values: 1.0 and 1.00048828125 (halfway to next half).
          # Both convert to FP16 1.0, so max_abs and rms_abs are nonzero.
          printf '\x00\x00\x80\x3f\x00\x10\x80\x3f' > reap-test-bin/audit-source.bin
          printf '\x00\x3c\x00\x3c' > reap-test-bin/audit-half.bin
          audit="reap-test-bin/reap_f16_audit_cli"
          if [[ "$RUNNER_OS" == "Windows" ]]; then audit="$audit.exe"; fi
          "$audit" reap-test-bin/audit-source.bin reap-test-bin/audit-half.bin 0 0 2 --max-abs 0.001 --max-rel 0.001 --max-rms 0.001
          if "$audit" reap-test-bin/audit-source.bin reap-test-bin/audit-half.bin 0 0 2 --max-abs 0 >/dev/null 2>&1; then
            echo "FAIL: strict absolute-error threshold accepted"; exit 1
          fi
          if "$audit" reap-test-bin/audit-source.bin reap-test-bin/audit-half.bin 0 0 2 --max-rel 0 >/dev/null 2>&1; then
            echo "FAIL: strict relative-error threshold accepted"; exit 1
          fi
          if "$audit" reap-test-bin/audit-source.bin reap-test-bin/audit-half.bin 0 0 2 --max-rms 0 >/dev/null 2>&1; then
            echo "FAIL: strict RMS-error threshold accepted"; exit 1
          fi
          # Reject byte corruption, short output, malformed limits, and duplicate flags.
          printf '\x01\x3c\x00\x3c' > reap-test-bin/audit-corrupt.bin
          printf '\x00\x3c' > reap-test-bin/audit-short.bin
          if "$audit" reap-test-bin/audit-source.bin reap-test-bin/audit-corrupt.bin 0 0 2 >/dev/null 2>&1; then
            echo "FAIL: corrupt FP16 payload accepted"; exit 1
          fi
          if "$audit" reap-test-bin/audit-source.bin reap-test-bin/audit-short.bin 0 0 2 >/dev/null 2>&1; then
            echo "FAIL: truncated FP16 payload accepted"; exit 1
          fi
          for invalid in nan inf -1 invalid; do
            if "$audit" reap-test-bin/audit-source.bin reap-test-bin/audit-half.bin 0 0 2 --max-abs "$invalid" >/dev/null 2>&1; then
              echo "FAIL: invalid threshold $invalid accepted"; exit 1
            fi
          done
          if "$audit" reap-test-bin/audit-source.bin reap-test-bin/audit-half.bin 0 0 2 --max-abs 1 --max-abs 1 >/dev/null 2>&1; then
            echo "FAIL: duplicate accuracy limit accepted"; exit 1
          fi
          # Invalid invocation must fail closed with a nonzero exit status.
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            if "./reap-test-bin/reap_f16_audit_cli.exe" >/dev/null 2>&1; then
              echo "FAIL: missing audit arguments accepted"; exit 1
            fi
          else
            if "./reap-test-bin/reap_f16_audit_cli" >/dev/null 2>&1; then
              echo "FAIL: missing audit arguments accepted"; exit 1
            fi
          fi
