; Defects found and fixed in Batch 1 (all in the drop as shipped)
D1_WIN32_ARGV_QUOTING=TASK_AND_TERMINAL_BROKEN
;   Every argv element was wrapped in double quotes, so cmd.exe received
;   /c payload as the literal token "echo hello" and failed with
;   'echo hello' is not recognized'. Domains 04 and 05 were fully broken.
;   Fixed with quoteWindowsArg + buildCommandLine (cmd-aware).
D2_CONPTY_STD_HANDLES=CHILD_OUTPUT_NEVER_REACHED_PTY
;   STARTF_USESTDHANDLES was not set, so the child inherited the parent's
;   real console. CreatePseudoConsole succeeded and exit codes were correct,
;   but all child output went to the parent terminal and the pipe carried
;   only ConPTY's VT init sequence. Probed 3 variants: inheritFALSE=no,
;   inheritTRUE=no, STARTF_USESTDHANDLES=yes.
D3_TASK_CANCEL_LEFT_DESCENDANTS_RUNNING
;   Only the direct child was terminated. Grandchildren kept the inherited
;   stdout handle open, so the trailing drain blocked until the slowest
;   grandchild exited. Fixed with a kill-on-close Job Object and a
;   non-blocking PeekNamedPipe drain. 29.27s -> 0.41s.
D4_TERMINAL_TEARDOWN_DEADLOCK=READER_JOIN_NEVER_RETURNED
;   terminate() closed outR while the reader thread was blocked in ReadFile
;   on it, then joined. Any interactive shell outliving its caller hung the
;   caller forever. Fixed by closing the pseudo console before joining.
D5_LSP_FILE_URI_MALFORMED=UNRESOLVABLE_ON_WINDOWS
;   "file://" + path.string() produced file://C:\dir\t.cpp. Only ever
;   resolvable on POSIX. Replaced with RFC 8089 toFileUri().
D6_EDITOR_ACTIVE_INDEX_STALE=OUT_OF_BOUNDS_READ
;   close() and moveTab() erased tabs without repairing EditorGroup::active,
;   so splitGroup(src,dup) read tabs[active] past the end.
D7_INVALID_REGEX_THREW_OUT_OF_API=std_regex_error_ESCAPED_FindRegex
D8_INDEXER_INDEXED_STRINGS_AND_COMMENTS=PHANTOM_DEFINITIONS
D9_COMPLETION_NONDETERMINISTIC=limit_applied_before_sort
D10_LSP_SMOKETEST_WEAK=passed_on_empty_result_null

; Defects found, NOT fixed (open)
D11_B2_DAP_ADAPTER_EXITS_BEFORE_READING_REQUEST=OPEN
