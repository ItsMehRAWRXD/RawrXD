# Runtime Capability Manifest
# Each entry generates a RuntimeCapability subclass with the uniform
# 10-phase lifecycle (discover/admit/initialize/execute/observe/verify/
# commit/persist/recover/shutdown).
#
# Domain-specific behavior is handwritten in the .cpp files AFTER generation.
# The generator only emits: declarations, registration, factory, IDs, CMake.
#
# Format:
#   - name: ClassName
#     ns: namespace (rawrxd::runtime | rawrxd::kernel | rawrxd::generation | rawrxd::certification)
#     id: numeric ID (auto-assigned if omitted)
#     category: inference|gpu|agent|build|ide|tool|model|quality|runtime|platform|kernel|cert|gen

