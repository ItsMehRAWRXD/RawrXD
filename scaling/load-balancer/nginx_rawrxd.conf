# RawrXD Load Balancer Configuration
# Nginx upstream configuration for multi-node RawrXD deployment
# Phase L.1 - Load Balancer Configuration

upstream rawrxd_backend {
    # Least connections algorithm for inference workloads
    least_conn;

    # Health check parameters
    server 192.168.1.10:8080 weight=5 max_fails=3 fail_timeout=30s;
    server 192.168.1.11:8080 weight=5 max_fails=3 fail_timeout=30s;
    server 192.168.1.12:8080 weight=3 max_fails=3 fail_timeout=30s backup;
    server 192.168.1.13:8080 weight=3 max_fails=3 fail_timeout=30s backup;

    # Keepalive connections for performance
    keepalive 32;
}

upstream rawrxd_ws_backend {
    # WebSocket support for streaming responses
    least_conn;

    server 192.168.1.10:8081 weight=5 max_fails=3 fail_timeout=30s;
    server 192.168.1.11:8081 weight=5 max_fails=3 fail_timeout=30s;
    server 192.168.1.12:8081 weight=3 max_fails=3 fail_timeout=30s backup;
    server 192.168.1.13:8081 weight=3 max_fails=3 fail_timeout=30s backup;

    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=stream_limit:10m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Cache zone for model metadata
proxy_cache_path /var/cache/nginx/rawrxd levels=1:2 keys_zone=rawrxd_cache:100m max_size=1g inactive=60m use_temp_path=off;

server {
    listen 80;
    listen [::]:80;
    server_name api.rawrxd.local;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.rawrxd.local;

    # SSL Configuration
    ssl_certificate /etc/nginx/ssl/rawrxd.crt;
    ssl_certificate_key /etc/nginx/ssl/rawrxd.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Request body size for large prompts
    client_max_body_size 50m;
    client_body_timeout 300s;
    client_header_timeout 300s;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Status endpoint for monitoring
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 192.168.1.0/24;
        deny all;
    }

    # API endpoints with rate limiting
    location /v1/completions {
        limit_req zone=api_limit burst=20 nodelay;
        limit_conn conn_limit 10;

        proxy_pass http://rawrxd_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running inference
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Buffer settings
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Streaming endpoints
    location /v1/completions/stream {
        limit_req zone=stream_limit burst=10 nodelay;

        proxy_pass http://rawrxd_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Disable buffering for streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # WebSocket support
    location /ws {
        proxy_pass http://rawrxd_ws_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Model info with caching
    location /v1/models {
        proxy_pass http://rawrxd_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        # Cache model metadata
        proxy_cache rawrxd_cache;
        proxy_cache_valid 200 5m;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Default API location
    location /v1/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://rawrxd_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Static files
    location /static/ {
        alias /var/www/rawrxd/static/;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }
}

# Metrics endpoint for Prometheus
server {
    listen 9090;
    server_name localhost;

    location /metrics {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow 192.168.1.0/24;
        deny all;
    }
}
