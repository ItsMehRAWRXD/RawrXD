# RawrXD HAProxy Configuration
# Alternative load balancer with advanced health checking
# Phase L.1 - Load Balancer Configuration

global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

    # Performance tuning
    maxconn 4096
    nbproc 2
    nbthread 4
    cpu-map auto:1/1-4 0-3

    # SSL performance
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    mode http
    option dontlognull
    option redispatch
    retries 3
    timeout connect 5s
    timeout client 300s
    timeout server 300s
    timeout http-keep-alive 10s
    timeout check 5s
    maxconn 2000
    errorfile 400 /etc/haproxy/errors/400.http
    errorfile 403 /etc/haproxy/errors/403.http
    errorfile 408 /etc/haproxy/errors/408.http
    errorfile 500 /etc/haproxy/errors/500.http
    errorfile 502 /etc/haproxy/errors/502.http
    errorfile 503 /etc/haproxy/errors/503.http
    errorfile 504 /etc/haproxy/errors/504.http

# Backend definitions
backend rawrxd_api
    balance leastconn
    option httpchk GET /health HTTP/1.1\r\nHost:\ localhost
    http-check expect status 200

    # Primary nodes
    server node1 192.168.1.10:8080 check weight 5 inter 5s rise 2 fall 3
    server node2 192.168.1.11:8080 check weight 5 inter 5s rise 2 fall 3

    # Backup nodes
    server node3 192.168.1.12:8080 check weight 3 inter 5s rise 2 fall 3 backup
    server node4 192.168.1.13:8080 check weight 3 inter 5s rise 2 fall 3 backup

    # Dynamic weight adjustment based on response time
    http-check send hdr Accept application/json
    stick-table type ip size 100k expire 30s
    stick on src

backend rawrxd_ws
    balance source
    option httpchk GET /health HTTP/1.1\r\nHost:\ localhost

    server ws1 192.168.1.10:8081 check inter 5s rise 2 fall 3
    server ws2 192.168.1.11:8081 check inter 5s rise 2 fall 3
    server ws3 192.168.1.12:8081 check inter 5s rise 2 fall 3 backup
    server ws4 192.168.1.13:8081 check inter 5s rise 2 fall 3 backup

# Frontend definitions
frontend rawrxd_http
    bind *:80
    redirect scheme https code 301 if !{ ssl_fc }

frontend rawrxd_https
    bind *:443 ssl crt /etc/haproxy/ssl/rawrxd.pem alpn h2,http/1.1

    # Rate limiting
    stick-table type ip size 100k expire 10s store http_req_rate(10s)
    http-request track-sc0 src
    http-request deny if { sc_http_req_rate(0) gt 100 }

    # Connection limiting
    stick-table type ip size 100k expire 30s store conn_cur
    http-request track-sc1 src
    http-request deny if { sc_conn_cur(1) gt 50 }

    # ACLs
    acl is_completions path_beg /v1/completions
    acl is_streaming path_beg /v1/completions/stream
    acl is_websocket hdr(Upgrade) -i websocket
    acl is_health path /health
    acl is_metrics path /metrics

    # Routing
    use_backend health_check if is_health
    use_backend metrics if is_metrics
    use_backend rawrxd_ws if is_websocket
    use_backend rawrxd_streaming if is_streaming
    use_backend rawrxd_api if is_completions
    default_backend rawrxd_api

backend health_check
    http-request return status 200 content-type "text/plain" string "healthy\n"

backend metrics
    http-request use-service prometheus-exporter

backend rawrxd_streaming
    balance leastconn
    option http-server-close
    option forceclose

    server stream1 192.168.1.10:8080 check weight 5
    server stream2 192.168.1.11:8080 check weight 5
    server stream3 192.168.1.12:8080 check weight 3 backup
    server stream4 192.168.1.13:8080 check weight 3 backup

# Statistics page
listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if TRUE
    stats auth admin:admin_password_change_me
