# Batch 6: GitHub Actions Workflow for Benchmark Suite
# 
# Triggers:
#   - Push to main branch
#   - Pull requests
#   - Scheduled runs (nightly)
#   - Manual dispatch
#
# Features:
#   - Matrix builds across platforms
#   - Baseline comparison
#   - Artifact upload
#   - Status reporting

name: RawrXD Benchmark Suite

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'CMakeLists.txt'
      - '.github/workflows/benchmark-suite.yml'
  pull_request:
    branches: [ main ]
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      benchmark_mode:
        description: 'Benchmark mode'
        required: true
        default: 'standard'
        type: choice
        options:
          - quick
          - standard
          - stress
          - ci
      compare_baseline:
        description: 'Compare against baseline'
        required: false
        default: true
        type: boolean

env:
  BUILD_TYPE: Release
  BENCHMARK_TIMEOUT: 3600

jobs:
  # ============================================================================
  # Build Job
  # ============================================================================
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            triplet: x64-linux
          - os: windows-latest
            triplet: x64-windows

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.25'

    - name: Setup vcpkg (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        git clone https://github.com/Microsoft/vcpkg.git
        ./vcpkg/bootstrap-vcpkg.sh
        ./vcpkg/vcpkg install curl nlohmann-json --triplet=${{ matrix.triplet }}

    - name: Setup vcpkg (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        git clone https://github.com/Microsoft/vcpkg.git
        .\vcpkg\bootstrap-vcpkg.bat
        .\vcpkg\vcpkg.exe install curl nlohmann-json --triplet=${{ matrix.triplet }}

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_TOOLCHAIN_FILE=./vcpkg/scripts/buildsystems/vcpkg.cmake \
          -DBUILD_BENCHMARKS=ON \
          -DENABLE_CI_MODE=ON

    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-binaries-${{ matrix.os }}
        path: |
          build/benchmark_runner
          build/benchmark_runner.exe
          build/*.dll
        retention-days: 1

  # ============================================================================
  # Quick Smoke Test
  # ============================================================================
  smoke-test:
    name: Quick Smoke Test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: benchmark-binaries-ubuntu-latest

    - name: Make executable
      run: chmod +x benchmark_runner

    - name: Run smoke test
      run: |
        ./benchmark_runner \
          --mode quick \
          --output-json smoke_test_results.json \
          --timeout 300

    - name: Upload smoke test results
      uses: actions/upload-artifact@v4
      with:
        name: smoke-test-results
        path: smoke_test_results.json

  # ============================================================================
  # Standard Benchmark Run
  # ============================================================================
  standard-benchmark:
    name: Standard Benchmark Suite
    needs: smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-benchmarks')

    services:
      sovereign:
        image: rawrxd/sovereign:latest
        ports:
          - 8080:8080
        options: --gpus all

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: benchmark-binaries-ubuntu-latest

    - name: Make executable
      run: chmod +x benchmark_runner

    - name: Wait for Sovereign
      run: |
        for i in {1..30}; do
          curl -s http://localhost:8080/health && break
          sleep 2
        done

    - name: Download baseline
      continue-on-error: true
      run: |
        curl -sL \
          https://raw.githubusercontent.com/${{ github.repository }}/benchmark-baseline/latest.json \
          -o baseline.json

    - name: Run standard benchmarks
      run: |
        ./benchmark_runner \
          --mode standard \
          --backend sovereign \
          --output-json benchmark_results.json \
          --output-junit benchmark_junit.xml \
          --compare-baseline baseline.json \
          --github-actions-output

    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results-${{ github.run_id }}
        path: |
          benchmark_results.json
          benchmark_junit.xml
        retention-days: 30

    - name: Comment PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const results = JSON.parse(fs.readFileSync('benchmark_results.json', 'utf8'));
          
          const summary = `
          ## Benchmark Results
          
          | Metric | Value |
          |--------|-------|
          | Total | ${results.summary.total_benchmarks} |
          | Passed | ${results.summary.passed} ✅ |
          | Failed | ${results.summary.failed} ${results.summary.failed > 0 ? '❌' : ''} |
          | Duration | ${results.summary.total_duration_seconds.toFixed(2)}s |
          
          ${results.summary.overall_success ? '✅ All benchmarks passed' : '❌ Some benchmarks failed'}
          `;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: summary
          });

  # ============================================================================
  # Stress Test (Nightly Only)
  # ============================================================================
  stress-test:
    name: Stress Test Suite
    needs: smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 180
    if: github.event_name == 'schedule' || github.event.inputs.benchmark_mode == 'stress'

    services:
      sovereign:
        image: rawrxd/sovereign:latest
        ports:
          - 8080:8080
        options: --gpus all

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: benchmark-binaries-ubuntu-latest

    - name: Make executable
      run: chmod +x benchmark_runner

    - name: Wait for Sovereign
      run: |
        for i in {1..30}; do
          curl -s http://localhost:8080/health && break
          sleep 2
        done

    - name: Run stress benchmarks
      run: |
        ./benchmark_runner \
          --mode stress \
          --backend sovereign \
          --output-json stress_results.json \
          --timeout 10800

    - name: Upload stress results
      uses: actions/upload-artifact@v4
      with:
        name: stress-test-results-${{ github.run_id }}
        path: stress_results.json
        retention-days: 90

  # ============================================================================
  # Results Analysis
  # ============================================================================
  analyze-results:
    name: Analyze Results
    needs: [standard-benchmark, stress-test]
    runs-on: ubuntu-latest
    if: always() && (needs.standard-benchmark.result == 'success' || needs.stress-test.result == 'success')

    steps:
    - name: Download all results
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Generate comparison report
      run: |
        python3 scripts/generate_comparison_report.py \
          --input artifacts/ \
          --output comparison_report.md

    - name: Upload comparison report
      uses: actions/upload-artifact@v4
      with:
        name: comparison-report
        path: comparison_report.md

    - name: Update baseline
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        python3 scripts/update_baseline.py \
          --results artifacts/benchmark-results-*/benchmark_results.json
