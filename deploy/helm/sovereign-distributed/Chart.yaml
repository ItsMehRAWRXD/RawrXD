# Phase D.4 Batch 2/5: Helm Charts
# Sovereign Distributed Runtime Helm Chart
# Copyright (c) 2026 RawrXD Team

apiVersion: v2
name: sovereign-distributed
description: A Helm chart for deploying the Sovereign Distributed Runtime on Kubernetes
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - sovereign
  - distributed
  - consensus
  - raft
  - kubernetes
home: https://rawrxd.io/sovereign
sources:
  - https://github.com/rawrxd/sovereign-distributed
maintainers:
  - name: RawrXD Team
    email: team@rawrxd.io
icon: https://rawrxd.io/icons/sovereign.png
annotations:
  category: Infrastructure
  licenses: Apache-2.0
dependencies:
  - name: prometheus
    version: 25.x.x
    repository: https://prometheus-community.github.io/helm-charts
    condition: monitoring.prometheus.enabled
    tags:
      - monitoring
  - name: grafana
    version: 7.x.x
    repository: https://grafana.github.io/helm-charts
    condition: monitoring.grafana.enabled
    tags:
      - monitoring
  - name: cert-manager
    version: 1.x.x
    repository: https://charts.jetstack.io
    condition: tls.certManager.enabled
    tags:
      - security
  - name: istio
    version: 1.x.x
    repository: https://istio-release.storage.googleapis.com/charts
    condition: serviceMesh.enabled
    tags:
      - mesh
