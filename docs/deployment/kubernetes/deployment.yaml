# RawrXD Sovereign Inferencer - Kubernetes Deployment
# Phase S.3: Kubernetes deployment manifests

apiVersion: v1
kind: Namespace
metadata:
  name: rawrxd
  labels:
    name: rawrxd
    app.kubernetes.io/name: rawrxd
    app.kubernetes.io/component: inference-server

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rawrxd-config
  namespace: rawrxd
data:
  config.yaml: |
    server:
      port: 8080
      tls:
        enabled: true
        certPath: /etc/rawrxd/certs/tls.crt
        keyPath: /etc/rawrxd/certs/tls.key
    
    inference:
      maxBatchSize: 16
      maxConcurrentRequests: 100
      timeout: 30s
      
    models:
      path: /models
      preload: []
      
    cache:
      type: distributed
      backend: redis
      ttl: 1h
      
    logging:
      level: info
      format: json
      output: stdout
      
    metrics:
      enabled: true
      port: 9090
      path: /metrics

---
apiVersion: v1
kind: Secret
metadata:
  name: rawrxd-tls
  namespace: rawrxd
type: kubernetes.io/tls
data:
  tls.crt: <base64-encoded-certificate>
  tls.key: <base64-encoded-key>

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rawrxd-models
  namespace: rawrxd
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: fast-ssd

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rawrxd-server
  namespace: rawrxd
  labels:
    app: rawrxd
    component: server
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: rawrxd
      component: server
  template:
    metadata:
      labels:
        app: rawrxd
        component: server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: rawrxd
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      initContainers:
        - name: model-downloader
          image: rawrxd/model-downloader:latest
          command:
            - /bin/sh
            - -c
            - |
              if [ ! -f /models/.downloaded ]; then
                echo "Downloading models..."
                # Download models from S3 or other storage
                aws s3 sync s3://rawrxd-models/ /models/
                touch /models/.downloaded
              fi
          volumeMounts:
            - name: models
              mountPath: /models
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: secret-access-key
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
      
      containers:
        - name: rawrxd
          image: rawrxd/sovereign-inferencer:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: https
              containerPort: 8443
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          
          env:
            - name: RAWRXD_ENVIRONMENT
              value: "production"
            - name: RAWRXD_LOG_LEVEL
              value: "info"
            - name: RAWRXD_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RAWRXD_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          
          volumeMounts:
            - name: config
              mountPath: /etc/rawrxd
              readOnly: true
            - name: tls
              mountPath: /etc/rawrxd/certs
              readOnly: true
            - name: models
              mountPath: /models
            - name: cache
              mountPath: /cache
            - name: tmp
              mountPath: /tmp
          
          resources:
            requests:
              memory: "4Gi"
              cpu: "2000m"
            limits:
              memory: "16Gi"
              cpu: "8000m"
          
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          
          startupProbe:
            httpGet:
              path: /health/startup
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      
      volumes:
        - name: config
          configMap:
            name: rawrxd-config
        - name: tls
          secret:
            secretName: rawrxd-tls
        - name: models
          persistentVolumeClaim:
            claimName: rawrxd-models
        - name: cache
          emptyDir:
            sizeLimit: 10Gi
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - rawrxd
                topologyKey: kubernetes.io/hostname
      
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: rawrxd

---
apiVersion: v1
kind: Service
metadata:
  name: rawrxd-server
  namespace: rawrxd
  labels:
    app: rawrxd
    component: server
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: https
      port: 8443
      targetPort: https
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
  selector:
    app: rawrxd
    component: server

---
apiVersion: v1
kind: Service
metadata:
  name: rawrxd-server-headless
  namespace: rawrxd
  labels:
    app: rawrxd
    component: server
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app: rawrxd
    component: server

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rawrxd-server
  namespace: rawrxd
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - api.rawrxd.io
      secretName: rawrxd-tls-cert
  rules:
    - host: api.rawrxd.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rawrxd-server
                port:
                  number: 8080

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rawrxd-server
  namespace: rawrxd
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rawrxd-server
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    - type: Pods
      pods:
        metric:
          name: rawrxd_inference_requests_per_second
        target:
          type: AverageValue
          averageValue: "100"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rawrxd-server
  namespace: rawrxd
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: rawrxd
      component: server

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rawrxd
  namespace: rawrxd
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT:role/rawrxd-server-role

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rawrxd
  namespace: rawrxd
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["rawrxd-tls"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rawrxd
  namespace: rawrxd
subjects:
  - kind: ServiceAccount
    name: rawrxd
    namespace: rawrxd
roleRef:
  kind: Role
  name: rawrxd
  apiGroup: rbac.authorization.k8s.io
