# Phase H.3/5: Kubernetes Operator - Helm Chart
# RawrXD Sovereign AI Runtime Helm Chart

apiVersion: v2
name: rawrxd
description: RawrXD Sovereign AI Runtime - Production-grade inference engine with stability envelope, intelligent ops, and hotpatch support
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - ai
  - inference
  - llm
  - vulkan
  - gpu
home: https://github.com/ItsMehRAWRXD/RawrXD
sources:
  - https://github.com/ItsMehRAWRXD/RawrXD
maintainers:
  - name: RawrXD Team
    email: team@rawrxd.ai
annotations:
  category: AI/ML
  licenses: MIT
dependencies:
  - name: prometheus
    version: 25.x.x
    repository: https://prometheus-community.github.io/helm-charts
    condition: prometheus.enabled
  - name: grafana
    version: 7.x.x
    repository: https://grafana.github.io/helm-charts
    condition: grafana.enabled
