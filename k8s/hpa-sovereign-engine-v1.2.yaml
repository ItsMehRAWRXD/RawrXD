apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sovereign-engine-hpa-v1.2
  namespace: production
  labels:
    app: sovereign-engine
    version: v1.2.0
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sovereign-engine-v1.2
  minReplicas: 15
  maxReplicas: 50
  metrics:
  - type: Pods
    pods:
      metric:
        name: sovereign_amx_utilization
      target:
        type: AverageValue
        averageValue: "80"
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
      - type: Percent
        value: 50
        periodSeconds: 30
      - type: Pods
        value: 5
        periodSeconds: 30
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Min
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sovereign-hpa-config
data:
  target_amx_utilization: "80"
  scale_up_delay: "30s"
  scale_down_delay: "300s"
  burst_headroom: "20%"
  notes: |
    Phase 19A: Optimized HPA Configuration
    - Target AMX utilization: 80% (was 90%)
    - Scale-up: 30s (was 60s) - faster burst response
    - Scale-down: 300s (was 60s) - prevent flapping
    - Min replicas: 15 (was 10) - higher baseline
    - Max replicas: 50 (was 40) - increased ceiling
