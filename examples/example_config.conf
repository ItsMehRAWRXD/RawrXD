# Sovereign CLI Example Configuration
# 
# This is an example configuration file for the Sovereign CLI.
# Copy this file and modify the values to suit your needs.
#
# Usage: SovereignCLI.exe config load example_config.conf

# =============================================================================
# General Settings
# =============================================================================

# Enable verbose output for detailed logging
verbose=false

# Number of threads to use (0 = auto-detect based on CPU cores)
numThreads=0

# Memory limit in MB (0 = unlimited)
memoryLimitMB=0

# =============================================================================
# Backend Selection
# =============================================================================

# Enable MASM optimized kernels (fastest)
useMASM=true

# Enable C++ intrinsics implementations (portable)
useIntrinsics=true

# Enable reference C++ implementations (slowest, for validation)
useReference=false

# =============================================================================
# Performance Settings
# =============================================================================

# Batch size for inference (1-8192)
batchSize=512

# Cache size in MB for KV cache and activations
cacheSizeMB=1024

# =============================================================================
# Inference Settings
# =============================================================================

# Temperature for sampling (0.0-2.0, lower = more deterministic)
temperature=0.80

# Maximum tokens to generate
maxTokens=2048

# =============================================================================
# Feature Flags
# =============================================================================

# Enable Flash Attention v2 (memory-efficient attention)
enableFlashAttention=true

# Enable quantization (Q4, Q8) support
enableQuantization=true

# Enable streaming output (for long generations)
enableStreaming=false

# Enable telemetry collection
enableTelemetry=false

# =============================================================================
# Example Configurations
# =============================================================================

# High-Performance Configuration:
# numThreads=16
# batchSize=1024
# cacheSizeMB=4096
# useMASM=true
# useIntrinsics=true

# Memory-Constrained Configuration:
# memoryLimitMB=4096
# batchSize=256
# cacheSizeMB=512
# enableFlashAttention=true

# Debug Configuration:
# verbose=true
# useMASM=false
# useIntrinsics=false
# useReference=true
# enableTelemetry=true
