groups:
  - name: hotpatch_system
    interval: 30s
    rules:
      # Critical: Patch failure rate too high
      - alert: HotpatchFailureRateHigh
        expr: |
          (
            sum(rate(hotpatch_failed_total[5m])) 
            / 
            (sum(rate(hotpatch_applied_total[5m])) + sum(rate(hotpatch_failed_total[5m])))
          ) > 0.1
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "High patch failure rate detected"
          description: "Patch failure rate is {{ $value | humanizePercentage }} over the last 5 minutes"
          runbook_url: "https://wiki.rawrxd.ai/runbooks/hotpatch-failure-rate"

      # Critical: Multiple rollbacks in short time
      - alert: HotpatchMultipleRollbacks
        expr: increase(hotpatch_rollback_total[10m]) > 2
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Multiple patch rollbacks detected"
          description: "{{ $value }} rollbacks in the last 10 minutes"
          runbook_url: "https://wiki.rawrxd.ai/runbooks/hotpatch-rollbacks"

      # Warning: Patch duration too long
      - alert: HotpatchDurationHigh
        expr: |
          histogram_quantile(0.95, 
            sum(rate(hotpatch_duration_seconds_bucket[5m])) by (le)
          ) > 60
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Patch application taking too long"
          description: "95th percentile patch duration is {{ $value }}s"
          runbook_url: "https://wiki.rawrxd.ai/runbooks/hotpatch-duration"

      # Warning: System unhealthy after patch
      - alert: HotpatchSystemUnhealthy
        expr: hotpatch_system_health == 0
        for: 1m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "System unhealthy after patch"
          description: "System {{ $labels.system }} is reporting unhealthy status"
          runbook_url: "https://wiki.rawrxd.ai/runbooks/hotpatch-system-health"

      # Info: Active patch count high
      - alert: HotpatchActiveCountHigh
        expr: sum(hotpatch_active_patches) > 15
        for: 10m
        labels:
          severity: info
          team: platform
        annotations:
          summary: "High number of active patches"
          description: "{{ $value }} patches are currently active"
          runbook_url: "https://wiki.rawrxd.ai/runbooks/hotpatch-active-count"

      # Critical: Emergency rollback executed
      - alert: HotpatchEmergencyRollback
        expr: increase(hotpatch_rollback_total{reason="emergency"}[1m]) > 0
        for: 0m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Emergency rollback executed"
          description: "Emergency rollback was triggered for system {{ $labels.system }}"
          runbook_url: "https://wiki.rawrxd.ai/runbooks/hotpatch-emergency"

      # Warning: Registry size growing
      - alert: HotpatchRegistrySize
        expr: hotpatch_registry_size > 1000
        for: 1h
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Patch registry size is large"
          description: "Registry contains {{ $value }} patches, consider cleanup"
          runbook_url: "https://wiki.rawrxd.ai/runbooks/hotpatch-registry-cleanup"

      # Critical: Security patch failed
      - alert: HotpatchSecurityPatchFailed
        expr: |
          increase(hotpatch_failed_total{type="security"}[1h]) > 0
        for: 0m
        labels:
          severity: critical
          team: security
        annotations:
          summary: "Security patch failed to apply"
          description: "Security patch failed on system {{ $labels.system }}"
          runbook_url: "https://wiki.rawrxd.ai/runbooks/hotpatch-security-failure"

      # Warning: Patch expiration approaching
      - alert: HotpatchExpiringSoon
        expr: |
          (
            time() - max by (bundle_id) (hotpatch_applied_timestamp)
          ) / 86400 > 25
        for: 1h
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Patch approaching expiration"
          description: "Patch {{ $labels.bundle_id }} will expire in {{ $value }} days"
          runbook_url: "https://wiki.rawrxd.ai/runbooks/hotpatch-expiration"

  - name: hotpatch_slo
    interval: 5m
    rules:
      # SLO: Patch success rate
      - alert: HotpatchSLOSuccessRate
        expr: |
          (
            sum(rate(hotpatch_applied_total[24h])) 
            / 
            (sum(rate(hotpatch_applied_total[24h])) + sum(rate(hotpatch_failed_total[24h])))
          ) < 0.99
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Patch success rate SLO breach"
          description: "24h success rate is {{ $value | humanizePercentage }}, below 99% SLO"
          runbook_url: "https://wiki.rawrxd.ai/runbooks/hotpatch-slo"

      # SLO: Patch rollback rate
      - alert: HotpatchSLORollbackRate
        expr: |
          (
            sum(rate(hotpatch_rollback_total[24h])) 
            / 
            sum(rate(hotpatch_applied_total[24h]))
          ) > 0.01
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Patch rollback rate SLO breach"
          description: "24h rollback rate is {{ $value | humanizePercentage }}, above 1% SLO"
          runbook_url: "https://wiki.rawrxd.ai/runbooks/hotpatch-slo"
