#============================================================================
# GitHub Actions Workflow: PR Validation
# RawrXD N-EVM - Fast validation for pull requests
#============================================================================

name: PR Validation

on:
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'src/**'
      - 'include/**'
      - 'CMakeLists.txt'
      - 'build_nevm.bat'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  #==========================================================================
  # Build and Test (Windows)
  #==========================================================================
  validate-windows:
    name: Validate (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Cache build
        uses: actions/cache@v3
        with:
          path: |
            build/
            *.obj
          key: ${{ runner.os }}-build-${{ hashFiles('src/**/*.cpp', 'src/**/*.hpp') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Build validation framework
        shell: cmd
        run: |
          cd src\nevm
          build_nevm.bat

      - name: Run PR CHECK validation
        shell: cmd
        run: |
          cd src\nevm\build
          nevm_validate.exe ..\..\..\test_model.gguf --mode=pr_check -o pr_report.json || exit /b 0

      - name: Upload PR report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-report-windows
          path: src/nevm/build/pr_report.json
          retention-days: 7

  #==========================================================================
  # Build and Test (Linux)
  #==========================================================================
  validate-linux:
    name: Validate (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libjsoncpp-dev

      - name: Cache build
        uses: actions/cache@v3
        with:
          path: |
            build/
            ~/.cmake
          key: ${{ runner.os }}-cmake-${{ hashFiles('src/**/*.cpp', 'src/**/*.hpp', 'CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cmake-

      - name: Build validation framework
        run: |
          cd src/nevm
          mkdir -p build && cd build
          cmake ..
          make -j$(nproc)

      - name: Run PR CHECK validation
        run: |
          cd src/nevm/build
          ./bin/nevm_validate ../../../test_model.gguf --mode=pr_check -o pr_report.json || true

      - name: Upload PR report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-report-linux
          path: src/nevm/build/pr_report.json
          retention-days: 7

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'src/nevm/build/pr_report.json';
            
            if (!fs.existsSync(path)) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '❌ PR Validation failed to produce report'
              });
              return;
            }
            
            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            const allPassed = report.summary.all_passed;
            const totalGates = report.summary.total_gates;
            const passedGates = report.summary.passed;
            
            const status = allPassed ? '✅' : '❌';
            const message = `${status} PR Validation: ${passedGates}/${totalGates} gates passed`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });
