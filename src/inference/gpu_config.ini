; RawrXD GPU Configuration
; Production-safe defaults

[gpu]
; Phase 1: Tiled MatMul (EXPERIMENTAL - currently slower than original)
; Set to true only for profiling and debugging
use_tiled_matmul = false

; Phase 2: Weight Cache (PRODUCTION READY - 7x speedup)
; Keep enabled for best performance
use_weight_cache = true
weight_cache_max_mb = 14000
weight_cache_preload_all = true

; Phase 3: Kernel Fusion (NOT IMPLEMENTED)
use_fused_kernels = false

; Phase 4: Medusa Speculative (NOT IMPLEMENTED)
use_medusa = false

; Phase 5: Quantization (NOT IMPLEMENTED)
use_fp8_compute = false
use_int4_weights = false

; Tiled MatMul tuning (only used if enabled)
tiled_workgroup_size = 32
tiled_enable_profiling = false
