apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: production
type: Opaque
stringData:
  jwt-secret: "your-super-secret-jwt-key-change-in-production"
  api-key: "your-api-key-change-in-production"
---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: production
type: Opaque
stringData:
  username: "postgres"
  password: "change-me-in-production"
---
apiVersion: v1
kind: Secret
metadata:
  name: cache-credentials
  namespace: production
type: Opaque
stringData:
  redis-url: "redis://:change-me-in-production@redis.cache.svc.cluster.local:6379"
---
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-credentials
  namespace: production
type: Opaque
stringData:
  client-id: "change-me-client-id"
  client-secret: "change-me-client-secret"
  oauth2-provider-url: "https://auth.example.com"
---
apiVersion: v1
kind: Secret
metadata:
  name: vault-credentials
  namespace: production
type: Opaque
stringData:
  vault-addr: "https://vault.example.com"
  vault-token: "change-me-vault-token"
  vault-namespace: "production"
---
apiVersion: v1
kind: Secret
metadata:
  name: docker-registry
  namespace: production
type: kubernetes.io/dockercfg
data:
  .dockercfg: ew0KICAicmVnaXN0cnkuZXhhbXBsZS5jb20iOiB7DQogICAgImF1dGgiOiAiY2hhbmdlLW1lLWJhc2U2NC1lbmNvZGVkLWNyZWRlbnRpYWxzIiwNCiAgICAiZW1haWwiOiAiYWRtaW5AZXhhbXBsZS5jb20iDQogIH0NCn0=
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-secret-store
  namespace: production
spec:
  provider:
    vault:
      server: "https://vault.example.com"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "production-role"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: vault-synced-secrets
  namespace: production
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-secret-store
    kind: SecretStore
  target:
    name: vault-secrets
    creationPolicy: Owner
  data:
    - secretKey: database-password
      remoteRef:
        key: database
        property: password
    - secretKey: jwt-key
      remoteRef:
        key: jwt
        property: secret
